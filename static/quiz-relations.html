<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isoler une grandeur — relations algébriques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root {
    --papier: #F0F3F9;
    --enonce: #FFFFFF;
    --enonce-pied: #F7F9FC;
    --carte: #FFFFFF;
    --encre: #14203B;
    --encre-2: #283A66;
    --gris: #5A657E;
    --trait: #D5DCE8;
    --trait-fort: #AEB8CC;
    --survol: #EDF1F9;
    --feutre: rgba(255, 220, 45, .88);
    --feutre-bord: rgba(255, 210, 20, .52);
    --feutre-reflet: rgba(255, 255, 255, .22);
    --feutre-melange: multiply;
    --feutre-texte: inherit;
    --stylo: #1856C9;
    --stylo-fond: rgba(24, 86, 201, .09);
    --juste: #117543;
    --juste-fond: #E3F5EB;
    --faux: #BD271C;
    --faux-fond: #FCEAE8;
    --ombre: 0 2px 8px rgba(20, 32, 59, .05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --papier: #0C1221;
      --enonce: #131C31;
      --enonce-pied: #17223B;
      --carte: #162038;
      --encre: #E9EDF7;
      --encre-2: #C8D2EB;
      --gris: #94A0BC;
      --trait: #273250;
      --trait-fort: #414F78;
      --survol: #1C2947;
      --feutre: rgba(250, 196, 25, .42);
      --feutre-bord: rgba(250, 196, 25, .22);
      --feutre-reflet: rgba(255, 255, 255, .06);
      --feutre-melange: normal;
      --feutre-texte: #FFF7D6;
      --stylo: #84B3FF;
      --stylo-fond: rgba(132, 179, 255, .13);
      --juste: #52D18C;
      --juste-fond: rgba(82, 209, 140, .14);
      --faux: #FF8075;
      --faux-fond: rgba(255, 128, 117, .14);
      --ombre: 0 4px 14px rgba(0, 0, 0, .22);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--papier); color: var(--encre); }
  body {
    font-family: "Atkinson Hyperlegible", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .quiz {
    max-width: 41rem;
    margin: 0 auto;
    padding: 1.1rem 1.1rem 2.5rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- en-tête ---------- */
  .top { display: flex; justify-content: space-between; align-items: center; gap: .8rem; }
  .title { font-weight: 700; font-size: 1.05rem; letter-spacing: .01em; }
  .meta {
    display: flex; align-items: center; gap: .65rem;
    color: var(--gris); font-size: .92rem; font-variant-numeric: tabular-nums;
  }
  .chrono:empty { display: none; }
  .count { font-weight: 700; color: var(--encre-2); }
  .serie {
    font-size: .82rem; font-weight: 700; color: var(--juste); background: var(--juste-fond);
    padding: .12rem .55rem; border-radius: 999px; white-space: nowrap;
  }
  .serie:empty { display: none; }
  .serie.pop { animation: pop .35s ease-out; }

  /* escalier : la hauteur de chaque marche encode la difficulté de la question */
  .ticks { display: flex; align-items: flex-end; gap: 5px; height: 24px; margin-top: .65rem; }
  .tick {
    flex: 1; height: var(--h, 30%); min-height: 4px;
    border-radius: 3px 3px 1px 1px; background: var(--trait);
    transition: background-color .2s, transform .2s;
  }
  .tick.current { background: var(--encre); }
  .tick.ok { background: var(--juste); }
  .tick.ko { background: var(--faux); }

  /* ---------- carte d'énoncé ---------- */
  .stage { flex: 1; padding: 1.15rem 0 1rem; }
  .fade { animation: appear .2s ease-out; }
  @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .problem-card {
    background: var(--enonce);
    border: 1.5px solid var(--trait);
    border-radius: 14px;
    box-shadow: var(--ombre);
    overflow: hidden;
    margin-bottom: 1rem;
  }
  .context {
    display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
    gap: .45rem; margin: 0; padding: .6rem .9rem 0;
    min-height: 1.8rem; color: var(--gris); font-size: .92rem;
  }
  .context:empty { min-height: .6rem; padding: 0; }
  .niveau {
    font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--encre-2); background: var(--enonce-pied);
    border: 1px solid var(--trait); border-radius: 999px; padding: .05rem .5rem;
  }
  .relation {
    --taille-rel: clamp(1.95rem, 7.8vw, 3.05rem);
    font-size: var(--taille-rel);
    min-height: calc(2.85 * var(--taille-rel));
    display: flex; align-items: center; justify-content: center;
    overflow-x: auto; padding: .45em .55em;
  }
  .prompt {
    display: flex; justify-content: center; align-items: center; gap: .4rem;
    margin: 0; padding: .65rem .9rem;
    background: var(--enonce-pied); border-top: 1px solid var(--trait);
    font-size: 1.05rem; font-weight: 700; color: var(--encre-2);
  }
  .prompt .var { font-size: 1.18em; color: var(--encre); padding: .1em .05em; }

  /* ---------- surligneur et repérage des termes ---------- */
  .hl-cible {
    position: relative; z-index: 0; display: inline-block;
    margin: 0 .08em; padding: 0 .04em;
    color: var(--feutre-texte);
  }
  .hl-cible::before {
    content: ""; position: absolute; z-index: -1; pointer-events: none;
    left: -.1em; right: -.06em; top: .14em; bottom: .02em;
    border-radius: .5em .26em .46em .3em / .42em .56em .38em .5em;
    background:
      linear-gradient(to bottom, transparent 28%, var(--feutre-reflet) 35%, transparent 45%),
      linear-gradient(100deg, var(--feutre-bord) 0%, var(--feutre) 14%, var(--feutre) 84%, var(--feutre-bord) 100%);
    transform: rotate(var(--rot, -1deg)) skewX(-8deg);
    mix-blend-mode: var(--feutre-melange);
  }
  .surlignage-discret .hl-cible::before {
    left: -.02em; right: -.02em; top: 52%; bottom: 14%;
    border-radius: .12em; transform: none;
    background: var(--feutre);
  }
  .hl-bouge {
    color: var(--stylo);
    font-weight: 700;
  }

  /* ---------- propositions (touches) ---------- */
  .options { display: flex; flex-direction: column; gap: .65rem; }
  .option {
    position: relative; display: flex; align-items: center; gap: .8rem;
    width: 100%; min-height: 4.8rem; padding: .65rem 1rem;
    background: var(--carte); color: var(--encre);
    border: 1.5px solid var(--trait); border-bottom-width: 4px; border-radius: 12px;
    font: inherit; text-align: left; cursor: pointer;
    box-shadow: var(--ombre);
    transition: transform .08s, border-color .12s, background-color .12s;
  }
  .option .key {
    flex: none; display: grid; place-items: center; width: 1.75rem; height: 1.75rem;
    font-size: .82rem; font-weight: 700; color: var(--gris);
    background: var(--enonce-pied);
    border: 1.5px solid var(--trait-fort); border-bottom-width: 3px; border-radius: 6px;
  }
  .option .expr { flex: 1; text-align: center; font-size: 1.42rem; overflow-x: auto; padding: .4em .3em; }
  .option:hover:not(:disabled) { border-color: var(--trait-fort); background: var(--survol); }
  .option:hover:not(:disabled) .key { color: var(--encre); border-color: var(--encre-2); }
  .option:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
  .option:disabled { cursor: default; box-shadow: none; }
  .option.is-correct { border-color: var(--juste); background: var(--juste-fond); color: var(--juste); animation: pop .32s ease-out; }
  .option.is-correct .key { border-color: var(--juste); color: var(--juste); background: transparent; }
  .option.is-wrong { border-color: var(--faux); background: var(--faux-fond); color: var(--faux); animation: shake .32s ease-in-out; }
  .option.is-wrong .key { border-color: var(--faux); color: var(--faux); background: transparent; }
  .option.is-dim { opacity: .4; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.02); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 55% { transform: translateX(4px); } 80% { transform: translateX(-2px); } }
  @media (hover: none) { .option .key { display: none; } }

  .dunno-row { text-align: center; margin-top: .5rem; min-height: 2.2rem; }
  .link {
    background: none; border: 0; padding: .35rem .6rem; font: inherit; font-size: .92rem;
    color: var(--gris); text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  .link:hover { color: var(--encre); }
  .nowrap { white-space: nowrap; }

  /* ---------- correction pas à pas ---------- */
  .feedback { margin: .9rem auto 0; max-width: 36rem; }
  .feedback:empty { min-height: 2.6em; }
  .verdict {
    margin: 0; text-align: center; font-weight: 700; font-size: 1.05rem;
    padding: .35rem .8rem; border-radius: 8px;
  }
  .feedback.ok .verdict { color: var(--juste); background: var(--juste-fond); }
  .feedback.ko .verdict { color: var(--faux); background: var(--faux-fond); }

  .steps {
    counter-reset: etape;
    margin: .75rem 0 0;
    background: var(--enonce);
    border: 1.5px solid var(--trait);
    border-radius: 12px;
    padding: .65rem .85rem;
    text-align: left;
  }
  .step {
    position: relative;
    padding: .45rem .55rem .5rem 2.15rem;
    border-radius: 8px;
  }
  .step + .step { margin-top: .35rem; }
  .step:not(.depart) { counter-increment: etape; }
  .step:not(.depart)::before {
    content: counter(etape); position: absolute; left: .4rem; top: .55rem;
    width: 1.35rem; height: 1.35rem; display: grid; place-items: center;
    font-size: .74rem; font-weight: 700; color: var(--stylo);
    background: var(--stylo-fond);
    border: 1.5px solid var(--stylo); border-radius: 50%;
  }
  .step.depart {
    padding-left: .55rem;
    border-bottom: 1px dashed var(--trait);
    padding-bottom: .6rem;
    margin-bottom: .35rem;
  }
  .step.depart .depart-label {
    font-size: .76rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: var(--gris); margin-bottom: .1rem;
  }
  .step .note {
    font-size: .92rem; color: var(--encre-2);
    margin-bottom: .18rem;
  }
  .step .eq {
    font-size: 1.22rem; overflow-x: auto;
    padding: .4em .35em; text-align: center;
  }
  .step.err { background: var(--faux-fond); border: 1px solid var(--faux); }
  .step.err::before { border-color: var(--faux); color: var(--faux); background: transparent; }
  .step.err .note { color: var(--faux); font-weight: 700; }
  .step .blame {
    font-size: .9rem; color: var(--faux); font-weight: 700;
    margin-top: .25rem; padding-top: .25rem;
    border-top: 1px solid rgba(194, 42, 31, .25);
  }
  .step.final { background: var(--juste-fond); border: 1px solid var(--juste); }
  .step.final::before { border-color: var(--juste); color: var(--juste); background: transparent; }
  .step.final.err { background: var(--faux-fond); border-color: var(--faux); }
  .step.final.err::before { border-color: var(--faux); color: var(--faux); }

  /* ---------- vérification numérique ---------- */
  details.check {
    margin-top: .65rem; text-align: left;
    background: var(--enonce); border: 1px solid var(--trait);
    border-radius: 10px; padding: .45rem .8rem;
  }
  details.check summary {
    cursor: pointer; color: var(--encre-2); font-size: .9rem;
    font-weight: 700; padding: .15rem 0;
  }
  details.check .check-body { padding-top: .45rem; border-top: 1px solid var(--trait); margin-top: .35rem; }
  details.check .line { padding: .25rem 0; font-size: .92rem; }
  details.check .bad {
    color: var(--faux); background: var(--faux-fond);
    padding: .35rem .55rem; border-radius: 6px; margin-top: .25rem;
  }
  details.check .good {
    color: var(--juste); background: var(--juste-fond);
    padding: .35rem .55rem; border-radius: 6px; margin-top: .25rem;
  }

  .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: .8rem; min-height: 3rem; margin-top: .9rem; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--stylo); outline-offset: 2px; }
  .btn {
    font: inherit; font-size: 1rem; font-weight: 700; padding: .6rem 1.5rem;
    border: 0; border-bottom: 3px solid rgba(0, 0, 0, .28); border-radius: 10px;
    background: var(--encre); color: var(--papier); cursor: pointer;
  }
  .btn:hover { background: var(--encre-2); }
  .btn:active { transform: translateY(2px); border-bottom-width: 1px; }
  [hidden] { display: none !important; }

  /* ---------- écran de résultat ---------- */
  .result { text-align: center; padding-top: 1.5rem; }
  .result-card {
    background: var(--enonce); border: 1.5px solid var(--trait);
    border-radius: 14px; padding: 1.4rem 1.2rem; box-shadow: var(--ombre);
  }
  .score { font-size: clamp(2.6rem, 11vw, 3.8rem); margin: 0; padding: .15em 0; }
  .times { color: var(--gris); margin: .45rem 0 0; font-size: .95rem; }
  .times .record { color: var(--juste); font-weight: 700; }
  .palier { margin: .8rem auto 0; max-width: 30rem; font-size: 1rem; }
  .palier strong { font-weight: 700; }
  .comment { max-width: 32rem; margin: .8rem auto .2rem; font-size: .98rem; line-height: 1.55; color: var(--encre-2); }

  .recap { text-align: left; margin-top: 1.4rem; }
  .recap h2 { font-size: 1.05rem; margin: 0 0 .7rem; }
  .item {
    background: var(--enonce); border: 1.5px solid var(--trait);
    border-radius: 12px; padding: .9rem 1rem; margin-bottom: .9rem;
    box-shadow: var(--ombre);
  }
  .item .ctx { font-size: .88rem; color: var(--gris); display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
  .item .rel { font-size: 1.35rem; text-align: center; overflow-x: auto; padding: .45em .3em; }
  .item .comp {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(13.5rem, 1fr));
    gap: .5rem; margin: .45rem 0;
  }
  .item .box {
    padding: .5rem .65rem; border-radius: 8px;
    display: flex; flex-direction: column; gap: .15rem;
  }
  .item .box.bad-box { background: var(--faux-fond); border: 1px solid var(--faux); }
  .item .box.good-box { background: var(--juste-fond); border: 1px solid var(--juste); }
  .item .lab { font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--gris); }
  .item .m { font-size: 1.12rem; overflow-x: auto; padding: .35em .15em; }
  .item .bad { color: var(--faux); }
  .item .good { color: var(--juste); }

  @media (prefers-reduced-motion: reduce) {
    .fade, .option.is-correct, .option.is-wrong, .serie.pop { animation: none; }
    .option, .tick { transition: none; }
    .option:active:not(:disabled), .btn:active { transform: none; }
  }
</style>
</head>
<body>
<main class="quiz">
  <header>
    <div class="top">
      <span class="title">Isoler une grandeur</span>
      <span class="meta">
        <span class="serie" id="serie" aria-live="polite"></span>
        <span class="chrono" id="chrono"></span>
        <span class="count" id="count"></span>
      </span>
    </div>
    <div class="ticks" id="ticks" aria-hidden="true" title="Chaque barre est une question ; sa hauteur indique sa difficulté."></div>
  </header>

  <section class="stage" id="screen-q" aria-live="polite">
    <div class="problem-card">
      <p class="context" id="context"></p>
      <div class="relation" id="relation"></div>
      <p class="prompt">Isoler <span class="var" id="target"></span></p>
    </div>
    <div class="options" id="options"></div>
    <div class="dunno-row" id="dunno-row"><button class="link" id="dunno" type="button">Je ne sais pas (voir la méthode)</button></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn" id="next" type="button" hidden>Question suivante</button></div>
  </section>

  <section class="result" id="screen-end" hidden>
    <div class="result-card">
      <p class="score" id="score"></p>
      <p class="times" id="times"></p>
      <p class="palier" id="palier"></p>
      <p class="comment" id="comment"></p>
    </div>
    <div class="recap" id="recap" hidden></div>
    <div class="actions">
      <button class="btn" id="restart" type="button">Recommencer une série</button>
    </div>
    <div class="actions"><button class="link" id="chrono-toggle" type="button"></button></div>
  </section>

  <noscript>Ce quiz nécessite JavaScript.</noscript>
</main>

<script id="engine">
/* =====================================================================
   Réglages
   ===================================================================== */
const CONFIG = {
  nbQuestions: 10,
  mode: 'lettres',                // 'lettres' (a, b, c…) ou 'physique' (symboles des relations) ; URL : ?mode=physique
  niveaux: ['2de', '1re', 'Tle'], // mode physique : niveaux tirés au sort ; URL : ?niveau=2de ou ?niveau=1re,Tle
  multSymbolLettres: '',          // mode lettres : '' (juxtaposition, 2ab), '\\times' ou '\\cdot'
  multSymbolPhysique: '\\times',  // mode physique : '\\times', '\\cdot' ou '' (juxtaposition)
  swapProbability: 0.25,          // dès la question 4 : relation parfois écrite « expression = grandeur »
  courbe: 0.65,                   // < 1 : les dernières bandes de difficulté sont resserrées sur le haut de l'échelle
  surlignage: 'feutre',           // 'feutre' (trait de surligneur) ou 'discret' (bande basse ajustée) ; URL : ?surlignage=discret
  autoAdvanceMs: 900,             // délai avant la question suivante après une bonne réponse
  chrono: true                    // false : chronomètre masqué par défaut
};

/* =====================================================================
   Arbres d'expressions
   Feuille : { v: identifiant, tex?, txt?, cst? (valeur numérique d'une constante) }
   ===================================================================== */
const v   = x => ({ v: x });
const sym = (id, texStr, txtStr) => ({ v: id, tex: texStr, txt: txtStr || id });
const num = n => ({ v: '#' + n, tex: String(n), txt: String(n), cst: n });
const N   = (op, l, r) => ({ op, l, r });
const add = (l, r) => N('+', l, r);
const sub = (l, r) => N('-', l, r);
const mul = (l, r) => N('*', l, r);
const div = (l, r) => N('/', l, r);

const isLeaf = t => 'v' in t;
const isConst = t => isLeaf(t) && t.cst !== undefined;
const isAdditive = t => !isLeaf(t) && (t.op === '+' || t.op === '-');

const rnd = n => Math.floor(Math.random() * n);
const randint = (a, b) => a + rnd(b - a + 1);
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}

function leaves(t, acc = []) {
  if (isLeaf(t)) acc.push(t.v); else { leaves(t.l, acc); leaves(t.r, acc); }
  return acc;
}
const contains = (t, x) => isLeaf(t) ? t.v === x : contains(t.l, x) || contains(t.r, x);
function findLeaf(t, x) {
  if (isLeaf(t)) return t.v === x ? t : null;
  return findLeaf(t.l, x) || findLeaf(t.r, x);
}
function depthOf(t, x, d = 0) {
  if (isLeaf(t)) return t.v === x ? d : -1;
  const a = depthOf(t.l, x, d + 1);
  return a >= 0 ? a : depthOf(t.r, x, d + 1);
}

function evalT(t, env) {
  if (isLeaf(t)) return isConst(t) ? t.cst : env[t.v];
  const a = evalT(t.l, env), b = evalT(t.r, env);
  switch (t.op) { case '+': return a + b; case '-': return a - b; case '*': return a * b; default: return a / b; }
}

/* Forme d'affichage : on regroupe les quotients en une seule fraction */
function norm(t) {
  if (isLeaf(t)) return t;
  const l = norm(t.l), r = norm(t.r);
  if (t.op === '*') {
    if (!isLeaf(l) && l.op === '/') return norm(div(mul(l.l, r), l.r));
    if (!isLeaf(r) && r.op === '/') return norm(div(mul(l, r.l), r.r));
  }
  if (t.op === '/') {
    if (!isLeaf(l) && l.op === '/') return norm(div(l.l, mul(l.r, r)));
    if (!isLeaf(r) && r.op === '/') return norm(div(mul(l, r.r), r.l));
  }
  return N(t.op, l, r);
}

/* =====================================================================
   Rendu LaTeX (KaTeX) et texte de secours
   ===================================================================== */
let MULT = '';   // symbole de multiplication de la question en cours de construction
const GREEK_TEX = { 'α': '\\alpha', 'β': '\\beta', 'λ': '\\lambda', 'ρ': '\\rho', 'ω': '\\omega', 'θ': '\\theta' };

function factorOrder(t) {
  let a = t.l, b = t.r;
  if (isConst(b) && !isConst(a)) [a, b] = [b, a];                  // 2 × d plutôt que d × 2
  else if (!MULT && isAdditive(a) && !isAdditive(b)) [a, b] = [b, a]; // d(a − b) plutôt que (a − b)d
  return [a, b];
}

/* Marquage visuel : la grandeur cherchée (surlignée) et le terme déplacé à l'étape en cours.
   Rendu par \htmlClass, que KaTeX n'accepte qu'avec l'option trust (voir math()). */
const HL = { cible: null, bouge: new Set() };
let TRI_PRODUITS = false;   // vrai en mode lettres
function tex(t, inFrac = false) {
  if (isLeaf(t)) {
    const base = t.tex !== undefined ? t.tex : (GREEK_TEX[t.v] || t.v);
    if (t.v === HL.cible) return '\\htmlClass{hl-cible}{' + base + '}';
    if (HL.bouge.has(t.v)) return '\\htmlClass{hl-bouge}{' + base + '}';
    return base;
  }
  const paren = s => /frac/.test(s) ? '\\left(' + s + '\\right)' : '(' + s + ')';
  switch (t.op) {
    case '+': return tex(t.l, inFrac) + ' + ' + tex(t.r, inFrac);
    case '-': return tex(t.l, inFrac) + ' - ' + (isAdditive(t.r) ? paren(tex(t.r, inFrac)) : tex(t.r, inFrac));
    case '*': {
      const f = n => isAdditive(n) ? paren(tex(n, inFrac)) : tex(n, inFrac);
      if (TRI_PRODUITS) {
        /* mode lettres : les facteurs d'un produit sont écrits dans l'ordre usuel,
           nombre d'abord, lettres dans l'ordre alphabétique, parenthèses en dernier (2abc(d − e)) */
        const fs = [];
        const cueillir = n => { if (!isLeaf(n) && n.op === '*') { cueillir(n.l); cueillir(n.r); } else fs.push(n); };
        cueillir(t);
        const rang = n => (isConst(n) ? 0 : isLeaf(n) ? 1 : 2);
        fs.sort((x, y) => rang(x) - rang(y) || (rang(x) === 1 ? String(x.tex).localeCompare(String(y.tex)) : 0));
        return fs.map((n, k) => (k === 0 ? '' : MULT ? ' ' + MULT + ' ' : ' ') + f(n)).join('');
      }
      const [a, b] = factorOrder(t);
      const sep = MULT ? ' ' + MULT + ' ' : (isAdditive(b) ? ' ' : '\\,');
      return f(a) + sep + f(b);
    }
    default: return (inFrac ? '\\frac' : '\\dfrac') + '{' + tex(t.l, true) + '}{' + tex(t.r, true) + '}';
  }
}

function txt(t) {
  if (isLeaf(t)) return t.txt !== undefined ? t.txt : t.v;
  switch (t.op) {
    case '+': return txt(t.l) + ' + ' + txt(t.r);
    case '-': return txt(t.l) + ' − ' + (isAdditive(t.r) ? '(' + txt(t.r) + ')' : txt(t.r));
    case '*': {
      const [a, b] = factorOrder(t);
      const f = n => isAdditive(n) ? '(' + txt(n) + ')' : txt(n);
      return f(a) + (MULT ? ' × ' : '·') + f(b);
    }
    default: {
      const w = n => isLeaf(n) ? txt(n) : '(' + txt(n) + ')';
      return w(t.l) + ' / ' + w(t.r);
    }
  }
}

/* =====================================================================
   Inversion d'une étape, avec erreurs typiques
   Équation courante : [expression contenant la cible] = O
   kind 0 = inversion correcte ; 1, 2 = erreurs d'opération ou d'ordre ;
   3, 4 = erreurs de priorité (distribution partielle)
   ===================================================================== */
function invertStep(op, inL, O, X, kind) {
  const Odiv = !isLeaf(O) && O.op === '/';
  switch (op) {
    case '+':                                   // T + X = O  →  T = O − X
      if (kind === 0) return sub(O, X);
      if (kind === 1) return add(O, X);
      if (kind === 2) return sub(X, O);
      if (kind === 3 && Odiv) return div(sub(O.l, X), O.r);
      return null;
    case '-':
      if (inL) {                                // T − X = O  →  T = O + X
        if (kind === 0) return add(O, X);
        if (kind === 1) return sub(O, X);
        if (kind === 2) return sub(X, O);
        if (kind === 3 && Odiv) return div(add(O.l, X), O.r);
      } else {                                  // X − T = O  →  T = X − O
        if (kind === 0) return sub(X, O);
        if (kind === 1) return sub(O, X);
        if (kind === 2) return add(X, O);
        if (kind === 3 && Odiv) return div(sub(X, O.l), O.r);
      }
      return null;
    case '*':                                   // T·X = O  →  T = O / X
      if (kind === 0) return div(O, X);
      if (kind === 1) return mul(O, X);
      if (kind === 2) return div(X, O);
      if (kind === 3 && isAdditive(O)) return N(O.op, O.l, div(O.r, X));
      if (kind === 4 && isAdditive(O)) return N(O.op, div(O.l, X), O.r);
      return null;
    default:
      if (inL) {                                // T / X = O  →  T = O·X
        if (kind === 0) return mul(O, X);
        if (kind === 1) return div(O, X);
        if (kind === 2) return div(X, O);
        if (kind === 3 && isAdditive(O)) return N(O.op, O.l, mul(O.r, X));
        if (kind === 4 && isAdditive(O)) return N(O.op, mul(O.l, X), O.r);
      } else {                                  // X / T = O  →  T = X / O
        if (kind === 0) return div(X, O);
        if (kind === 1) return mul(X, O);
        if (kind === 2) return div(O, X);
        if (kind === 3 && isAdditive(O)) return N(O.op, div(X, O.l), div(X, O.r));
      }
      return null;
  }
}

const ERR_MSG = {
  '+1':  "Pour éliminer un terme ajouté, on le soustrait aux deux membres : le signe change.",
  '+2':  "La soustraction est écrite dans le mauvais ordre.",

  '-L1': "Pour éliminer un terme retranché, on l'ajoute aux deux membres.",
  '-L2': "En ajoutant le terme retranché aux deux membres, on obtient une somme, pas une différence.",
  '-L3': "Priorités : on ajoute le terme à la fraction entière, il ne va pas au numérateur.",
  '-R1': "Piège du signe : la grandeur cherchée est retranchée, la différence se lit dans l'autre sens.",
  '-R2': "La grandeur cherchée est retranchée : on l'obtient par une différence, pas par une somme.",
  '-R3': "Priorités : on retranche la fraction entière, le terme ne va pas au numérateur.",
  '*1':  "Pour éliminer un facteur, on divise les deux membres par ce facteur.",
  '*2':  "Bonne opération, mais le quotient est à l'envers.",
  '*3':  "La division porte sur toute la somme (ou la différence), pas sur un seul de ses termes.",
  '/L1': "Pour éliminer un dénominateur, on multiplie les deux membres par ce dénominateur.",
  '/L2': "En multipliant par le dénominateur, on obtient un produit, pas un quotient.",
  '/L3': "La multiplication porte sur toute la somme (ou la différence), pas sur un seul de ses termes.",
  '/R1': "La grandeur cherchée est au dénominateur : on aboutit à un quotient, pas à un produit.",
  '/R2': "La grandeur cherchée est au dénominateur : le quotient est à l'envers.",
  '/R3': "Une fraction ne se découpe pas selon les termes de son dénominateur."
};

function solveFor(side, other, target, err) {
  let e = side, O = other, step = 0, errKey = null;
  while (!isLeaf(e)) {
    const inL = contains(e.l, target);
    const X = inL ? e.r : e.l;
    const kind = (err && err.step === step) ? err.kind : 0;
    const res = invertStep(e.op, inL, O, X, kind);
    if (!res) return null;
    if (kind > 0) {
      const k = kind >= 3 ? 3 : kind;
      errKey = (e.op === '-' || e.op === '/') ? e.op + (inL ? 'L' : 'R') + k : e.op + k;
    }
    O = res; e = inL ? e.l : e.r; step++;
  }
  return { tree: O, errKey, errStep: err ? err.step : -1 };
}

/* Trace de la résolution : une ligne par transformation, avec sa justification.
   Les cas « grandeur retranchée » et « grandeur au dénominateur » sont détaillés en deux temps,
   parce que c'est là que se concentrent les erreurs. */
function traceSolve(side, other, target, echange) {
  const rows = [];
  const pas = (l, r, bouge, gabarit, step) => {
    HL.bouge = new Set(bouge ? leaves(bouge) : []);
    const note = gabarit ? gabarit.replace('#', () => '$' + tex(norm(bouge)) + '$') : null;
    rows.push({ tex: tex(norm(l)) + ' = ' + tex(norm(r)), txt: txt(norm(l)) + ' = ' + txt(norm(r)), note, step });
    HL.bouge = new Set();
  };
  let e = side, O = other, step = 0;
  pas(e, O, null, echange ? 'On écrit la relation en plaçant à gauche le membre qui contient la grandeur cherchée' : null, -1);
  rows[0].depart = !echange;
  while (!isLeaf(e)) {
    const inL = contains(e.l, target);
    const X = inL ? e.r : e.l;
    const T = inL ? e.l : e.r;
    if (e.op === '+') { const R = sub(O, X); pas(T, R, X, 'On retranche # aux deux membres', step); O = R; }
    else if (e.op === '-' && inL) { const R = add(O, X); pas(T, R, X, 'On ajoute # aux deux membres', step); O = R; }
    else if (e.op === '-') {
      pas(X, add(O, T), T, 'On ajoute # aux deux membres, pour que la grandeur cherchée ne soit plus retranchée', step);
      const R = sub(X, O);
      pas(T, R, O, 'On retranche # aux deux membres', step);
      O = R;
    }
    else if (e.op === '*') { const R = div(O, X); pas(T, R, X, 'On divise les deux membres par #', step); O = R; }
    else if (e.op === '/' && inL) { const R = mul(O, X); pas(T, R, X, 'On multiplie les deux membres par #', step); O = R; }
    else {
      pas(X, mul(O, T), T, 'On multiplie les deux membres par #, pour que la grandeur cherchée ne soit plus au dénominateur', step);
      const R = div(X, O);
      pas(T, R, O, 'On divise les deux membres par #', step);
      O = R;
    }
    e = T; step++;
  }
  rows[rows.length - 1].final = true;
  return rows;
}

/* Vérification numérique : substituer des valeurs simples et voir laquelle des deux
   propositions redonne la relation de départ. */
function fmtNum(x, approx = true) {
  const r = Math.round(x * 100) / 100;
  return (approx && Math.abs(r - x) > 1e-9 ? '\\approx ' : '') + String(r).replace('.', '{,}');
}
function numCheck(lhs, rhs, target, correctTree, wrongTree) {
  const vars = [...new Set(leaves(lhs).concat(leaves(rhs)))].filter(x => x !== target && x[0] !== '#');
  const nameOf = x => tex(findLeaf(lhs, x) || findLeaf(rhs, x));
  const joli = x => Math.abs(x * 10 - Math.round(x * 10)) < 1e-9;
  for (let t = 0; t < 900; t++) {
    const env = {};
    vars.forEach(x => { env[x] = randint(2, t < 450 ? 9 : 12); });
    if (new Set(vars.map(x => env[x])).size !== vars.length) continue;
    const tv = evalT(correctTree, env);
    if (tv < 0.5 || tv > 400) continue;
    if (t < 450 ? !Number.isInteger(tv) : !joli(tv)) continue;
    const wv = evalT(wrongTree, env);
    if (!isFinite(wv) || Math.abs(wv - tv) < 1e-9) continue;
    const e1 = Object.assign({}, env); e1[target] = tv;
    const e2 = Object.assign({}, env); e2[target] = wv;
    const L1 = evalT(lhs, e1), R1 = evalT(rhs, e1), L2 = evalT(lhs, e2), R2 = evalT(rhs, e2);
    if (!isFinite(L2) || !isFinite(R2) || Math.abs(L2 - R2) < 1e-9) continue;
    return {
      donnees: vars.map(x => [nameOf(x), env[x]]).sort((u, w) => u[0].localeCompare(w[0]))
        .map(([n, v]) => '$' + n + ' = ' + v + '$').join(', '),
      mauvais: '$' + fmtNum(wv) + '$', mauvaisRel: '$' + fmtNum(L2, false) + ' \\neq ' + fmtNum(R2, false) + '$',
      bon: '$' + fmtNum(tv) + '$', bonRel: '$' + fmtNum(L1, false) + ' = ' + fmtNum(R1, false) + '$'
    };
  }
  return null;
}

function shapeOf(t, s = { div: 0, add: 0, mul: 0 }) {
  if (isLeaf(t)) return s;
  if (t.op === '/') s.div++; else if (t.op === '*') s.mul++; else s.add++;
  shapeOf(t.l, s); shapeOf(t.r, s);
  return s;
}
const shapeDist = (a, b) => Math.abs(a.div - b.div) + Math.abs(a.add - b.add) + 0.5 * Math.abs(a.mul - b.mul);

/* Construit une question à partir d'une relation et d'une grandeur à isoler (null si impossible) */
function makeQuestion(lhs, rhs, target, opts) {
  MULT = opts.mult;
  HL.cible = target;
  HL.bouge = new Set();
  const onLeft = contains(lhs, target);
  const side = onLeft ? lhs : rhs, other = onLeft ? rhs : lhs;

  const vars = [...new Set(leaves(lhs).concat(leaves(rhs)))];
  const envs = [0, 1, 2, 3].map(() => Object.fromEntries(vars.map(x => [x, 1.3 + Math.random() * 8.4])));
  const sig = t => envs.map(env => evalT(t, env));
  const same = (p, q) => p.every((x, i) => Math.abs(x - q[i]) <= 1e-9 * Math.max(1, Math.abs(x), Math.abs(q[i])));

  const correct = norm(solveFor(side, other, target, null).tree);
  const cSig = sig(correct);
  const depth = depthOf(side, target);

  const cands = [];
  for (let s = 0; s < depth; s++) {
    for (let k = 1; k <= 4; k++) {
      const r = solveFor(side, other, target, { step: s, kind: k });
      if (!r) continue;
      const t = norm(r.tree);
      const sg = sig(t);
      if (!sg.every(Number.isFinite)) continue;
      if (same(sg, cSig) || cands.some(c => same(c.sg, sg))) continue;
      cands.push({ tree: t, sg, key: r.errKey, step: s, partial: k >= 3 });
    }
  }
  if (cands.length < 2) return null;

  const shape = shapeOf(correct);
  cands.forEach(c => {
    c.score = Math.min(shapeDist(shape, shapeOf(c.tree)), 1.8) - (c.partial ? 1 : 0)
      - (COUVERTURE.has(c.key) ? 0 : 1.1) + Math.random() * 1.2;
  });
  cands.sort((a, b) => a.score - b.score);
  const chosen = [cands[0]];
  const second = cands.slice(1).find(c => c.step !== cands[0].step) || cands[1];
  chosen.push(second);
  chosen.forEach(c => COUVERTURE.add(c.key));

  const [A, B] = opts.swap ? [norm(rhs), norm(lhs)] : [norm(lhs), norm(rhs)];
  const leaf = findLeaf(side, target);
  const tv = tex(leaf), tt = txt(leaf);

  const options = shuffle([
    { tex: tv + ' = ' + tex(correct), txt: tt + ' = ' + txt(correct), ok: true, tree: correct },
    ...chosen.map(c => ({
      tex: tv + ' = ' + tex(c.tree), txt: tt + ' = ' + txt(c.tree), ok: false,
      msg: ERR_MSG[c.key], tree: c.tree, errStep: c.step,
      check: numCheck(lhs, rhs, target, correct, c.tree)
    }))
  ]);

  return {
    label: opts.label || '', target, targetTex: tv, targetTxt: tt, lhs, rhs,
    relTex: tex(A) + ' = ' + tex(B),
    relTxt: txt(A) + ' = ' + txt(B),
    steps: traceSolve(side, other, target, onLeft === !!opts.swap),
    options
  };
}

function difficulty(lhs, rhs, target) {
  const onLeft = contains(lhs, target);
  const other = onLeft ? rhs : lhs;
  const all = leaves(lhs).concat(leaves(rhs));
  const nVars = new Set(all.filter(id => id[0] !== '#')).size;
  let cout = 0, t = onLeft ? lhs : rhs;
  while (!isLeaf(t)) {
    const inL = contains(t.l, target);
    const X = inL ? t.r : t.l;
    cout += 1;
    if (!inL && t.op === '/') cout += 2;
    if (!inL && t.op === '-') cout += 1.5;
    if (!isLeaf(X)) cout += 0.5;
    t = inL ? t.l : t.r;
  }
  return 1.5 * cout + 0.5 * nVars + (isLeaf(other) ? 0 : 1) + (all.some(id => id[0] === '#') ? 0.5 : 0);
}

const LETTRES = 'abcdefgh';
function enLettres(l, r, cible, swap) {
  const [A, B] = swap ? [r, l] : [l, r];
  const marque = t => isLeaf(t) ? (isConst(t) ? t : { v: t.v, tex: '⟦' + t.v + '⟧' }) : N(t.op, marque(t.l), marque(t.r));
  const garde = HL.cible;
  HL.cible = null;
  const lu = tex(norm(marque(A))) + ' = ' + tex(norm(marque(B)));
  HL.cible = garde;
  const ordre = [...new Set([...lu.matchAll(/⟦([^⟧]+)⟧/g)].map(m => m[1]))];
  const nom = id => LETTRES[ordre.indexOf(id)];
  const conv = t => isLeaf(t) ? (isConst(t) ? t : { v: nom(t.v), tex: nom(t.v), txt: nom(t.v) }) : N(t.op, conv(t.l), conv(t.r));
  return [conv(l), conv(r), nom(cible)];
}

function physicsPairs() {
  const lettres = CONFIG.mode === 'lettres';
  let liste = lettres ? PHYSICS : PHYSICS.filter(r => CONFIG.niveaux.includes(r.niveau));
  if (liste.length < 6) liste = PHYSICS;
  const pairs = [], dejaVu = new Set();
  liste.forEach(r => {
    const [l, rr] = r.f();
    r.targets.forEach(tg => {
      let family = r.family;
      if (lettres) {
        MULT = CONFIG.multSymbolLettres;
        const [L, R, c] = enLettres(l, rr, tg, false);
        const rel = txt(L) + ' = ' + txt(R);
        if (dejaVu.has(rel + '|' + c)) return;
        dejaVu.add(rel + '|' + c);
        family = rel;
      }
      pairs.push({ r, target: tg, family, score: difficulty(l, rr, tg) });
    });
  });
  return pairs.sort((a, b) => a.score - b.score);
}

function tenter(candidats, i, used, vus) {
  for (const o of shuffle(candidats)) {
    const [l, r] = o.r.f();
    const swap = i >= 3 && Math.random() < CONFIG.swapProbability;
    const lettres = CONFIG.mode === 'lettres';
    const mult = lettres ? CONFIG.multSymbolLettres : CONFIG.multSymbolPhysique;
    MULT = mult;
    TRI_PRODUITS = lettres;
    const [L, R, cible] = lettres ? enLettres(l, r, o.target, swap) : [l, r, o.target];
    const q = makeQuestion(L, R, cible, { swap, mult, label: lettres ? '' : o.r.label });
    if (q) {
      used.add(o.family); vus.add(o.family + '|' + o.target);
      if (!lettres) q.niveau = o.r.niveau;
      q.score = o.score;
      return q;
    }
  }
  return null;
}

function buildSeries(nq = CONFIG.nbQuestions) {
  COUVERTURE.clear();
  const pairs = physicsPairs();
  const used = new Set(), vus = new Set();
  const qs = [];
  const bord = x => Math.floor(pairs.length * Math.pow(x / nq, CONFIG.courbe));
  for (let i = 0; i < nq; i++) {
    const lo = bord(i), hi = Math.max(bord(i + 1), lo + 1);
    const libre = p => !used.has(p.family);
    const inedit = p => !vus.has(p.family + '|' + p.target);
    const q =
      tenter(pairs.slice(lo, hi).filter(libre), i, used, vus) ||
      tenter(pairs.slice(lo).filter(libre), i, used, vus) ||
      tenter(pairs.filter(libre), i, used, vus) ||
      tenter(pairs.slice(lo, hi).filter(inedit), i, used, vus) ||
      tenter(pairs.filter(inedit), i, used, vus);
    if (q) qs.push(q);
  }
  return qs.sort((a, b) => a.score - b.score);
}

    if (this.depuis !== null) { this.cumul += performance.now() - this.depuis; this.depuis = null; }
    clearInterval(this.tick); this.tick = null; this.afficher();
  },
  stop() { this.arme = false; this.pause(); },
  ms() { return this.cumul + (this.depuis === null ? 0 : performance.now() - this.depuis); },

function court(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

function duree(ms) {
  const s = Math.round(ms / 1000);
  return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s';
}
function moyenne(ms) {
  return ms < 10000 ? String(Math.round(ms / 100) / 10).replace('.', ',') + ' s' : duree(ms);
}

/* Les relations longues sont réduites par rapport à leur propre taille calculée */
function ajuster(el) {
  if (!el || !el.clientWidth) return;
  el.style.fontSize = '';
  el.classList.add('nowrap');
  const base = parseFloat(getComputedStyle(el).fontSize);
  let f = 100;
  while (el.scrollWidth > el.clientWidth + 1 && f > 58) {
    f -= 6;
    el.style.fontSize = (base * f / 100) + 'px';
  }
  if (el.scrollWidth > el.clientWidth + 1) el.classList.remove('nowrap');
}

  if (!els.screenQ.hidden) {

    .replace(/\\dfrac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)')

}

function rich(el, str) {
  el.textContent = '';
  String(str).split('$').forEach((part, i) => {
    if (i % 2 === 0) { if (part) el.appendChild(document.createTextNode(part)); return; }
    const sp = document.createElement('span');
    math(sp, part, plain(part));
    if (plain(part).length < 32) sp.className = 'nowrap';
    el.appendChild(sp);
  });
}

/* Correction pas à pas */
function renderSteps(box, q, chosen) {
  const wrap = document.createElement('div');
  wrap.className = 'steps';
  const eqs = [];
  q.steps.forEach((r, i) => {
    const blame = chosen && !chosen.ok && r.step === chosen.errStep
      && !q.steps.slice(i + 1).some(x => x.step === chosen.errStep);
    const div = document.createElement('div');
    div.className = 'step' + (r.depart ? ' depart' : '') + (blame ? ' err' : '') + (r.final ? ' final' : '');
    if (r.depart) {
      const dl = document.createElement('div');
      dl.className = 'depart-label';
      dl.textContent = 'Relation de départ';
      div.appendChild(dl);
    }
    if (r.note) { const n = document.createElement('div'); n.className = 'note'; rich(n, r.note); div.appendChild(n); }
    const eq = document.createElement('div');
    eq.className = 'eq';
    math(eq, r.tex, r.txt);
    div.appendChild(eq);
    eqs.push(eq);
    if (blame && chosen.msg) {
      const b = document.createElement('div');
      b.className = 'blame';
      rich(b, 'L’erreur est ici : ' + chosen.msg);
      div.appendChild(b);
    }
    wrap.appendChild(div);
  });
  box.appendChild(wrap);
  eqs.forEach(ajuster);
}

function renderCheck(box, q, chosen) {
  const c = chosen && chosen.check;
  if (!c) return;
  const det = document.createElement('details');
  det.className = 'check';
  const sum = document.createElement('summary');
  sum.textContent = 'Vérifier avec des nombres simples';
  det.appendChild(sum);
  const body = document.createElement('div');
  body.className = 'check-body';
  const intro = document.createElement('div');
  intro.className = 'line';
  rich(intro, 'En remplaçant par : ' + c.donnees + '.');
  body.appendChild(intro);
  const l1 = document.createElement('div');
  l1.className = 'line bad';
  rich(l1, 'Proposition choisie : ' + c.mauvais + ' → la relation de départ donne ' + c.mauvaisRel + ' (fausse).');
  body.appendChild(l1);
  const l2 = document.createElement('div');
  l2.className = 'line good';
  rich(l2, 'Réponse attendue : ' + c.bon + ' → la relation de départ donne ' + c.bonRel + ' (vraie).');
  body.appendChild(l2);
  det.appendChild(body);
  box.appendChild(det);
}

function show(screen) {
  els.screenQ.hidden = screen !== 'q';
  els.screenEnd.hidden = screen !== 'end';
}

function start() {
  clearTimeout(state.timer);
  state.questions = buildSeries(NQ);
  state.answers = [];
  state.i = 0;
  chrono.reset();
  state.serie = 0; state.meilleureSerie = 0; majSerie();
  const tous = physicsPairs(), smin = tous[0].score, smax = tous[tous.length - 1].score;
  els.ticks.innerHTML = '';
  state.questions.forEach(q => {
    const t = document.createElement('span');
    t.className = 'tick';
    t.style.setProperty('--h', Math.round(18 + 82 * (q.score - smin) / Math.max(1e-9, smax - smin)) + '%');
    els.ticks.appendChild(t);
  });
  show('q');
  showQuestion();
}

function showQuestion() {
  const q = state.questions[state.i];
  state.locked = false;
  els.count.textContent = (state.i + 1) + ' / ' + NQ;
  [...els.ticks.children].forEach((t, k) => t.classList.toggle('current', k === state.i));

  contexte(els.context, q);
  math(els.relation, q.relTex, q.relTxt);
  math(els.target, q.targetTex, q.targetTxt);

  els.options.innerHTML = '';
  q.options.forEach((o, k) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'option';
    b.innerHTML = '<span class="key">' + (k + 1) + '</span><span class="expr"></span>';
    math(b.querySelector('.expr'), o.tex, o.txt);
    b.setAttribute('aria-label', 'Proposition ' + (k + 1) + ' : ' + o.txt);
    b.addEventListener('click', () => answer(k));
    els.options.appendChild(b);
  });

  els.dunno.hidden = false;
  els.feedback.innerHTML = '';
  els.feedback.className = 'feedback';
  els.next.hidden = true;

  els.screenQ.classList.remove('fade');
  void els.screenQ.offsetWidth;
  els.screenQ.classList.add('fade');
  ajuster(els.relation);
  [...els.options.querySelectorAll('.expr')].forEach(ajuster);
  chrono.demarrer();
}

function answer(k) {
  if (state.locked) return;
  state.locked = true;
  chrono.stop();
  const q = state.questions[state.i];
  const chosen = k >= 0 ? q.options[k] : null;
  const ok = !!(chosen && chosen.ok);
  state.answers.push({ q, chosen, ok });

  [...els.options.children].forEach((b, j) => {
    b.disabled = true;
    if (q.options[j].ok) b.classList.add('is-correct');
    else if (j === k) b.classList.add('is-wrong');
    else b.classList.add('is-dim');
  });
  els.dunno.hidden = true;
  const tick = els.ticks.children[state.i];
  tick.classList.remove('current');
  tick.classList.add(ok ? 'ok' : 'ko');
  state.serie = ok ? state.serie + 1 : 0;
  state.meilleureSerie = Math.max(state.meilleureSerie, state.serie);
  majSerie();
  if (ok && state.serie >= 2) { els.serie.classList.remove('pop'); void els.serie.offsetWidth; els.serie.classList.add('pop'); }

  els.feedback.innerHTML = '';
  els.feedback.className = 'feedback ' + (ok ? 'ok' : chosen ? 'ko' : '');
  const v = document.createElement('p');
  v.className = 'verdict';
  v.textContent = ok ? 'Juste.' : chosen ? 'Pas tout à fait — observons les étapes :' : 'Voici la résolution étape par étape :';
  els.feedback.appendChild(v);

  if (ok) {
    state.timer = setTimeout(next, CONFIG.autoAdvanceMs);
    return;
  }
  renderSteps(els.feedback, q, chosen);
  renderCheck(els.feedback, q, chosen);
  els.next.textContent = state.i === NQ - 1 ? 'Voir le résultat' : 'Question suivante';
  els.next.hidden = false;
  els.next.focus({ preventScroll: true });
  if (els.feedback.getBoundingClientRect().bottom > window.innerHeight) {
    els.feedback.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function next() {
  clearTimeout(state.timer);
  if (state.i >= NQ - 1) { showEnd(); return; }
  state.i++;
  showQuestion();
}

function commentFor(s) {
  let c;
  if (s === NQ) c = "Sans faute : les automatismes sont en place.";
  else if (s >= 0.8 * NQ) c = "Très bien. Les règles sont acquises ; relire les quelques erreurs ci-dessous pour qu’elles ne deviennent pas des habitudes.";
  else if (s >= 0.6 * NQ) c = "Bien. Les cas simples sont maîtrisés, mais les relations imbriquées demandent encore de l’attention : procéder pas à pas, en écrivant chaque étape.";
  else if (s >= 0.4 * NQ) c = "C’est un début. Pour isoler une grandeur, on défait les opérations une à une, en commençant par la dernière effectuée, et on applique chaque opération aux deux membres.";
  else c = "Les règles ne sont pas encore en place. Reprendre les relations à trois grandeurs (produit, quotient, somme, différence), puis recommencer.";
  if (s < NQ && CONFIG.mode === 'physique') c += " Vérifier l’unité de l’expression obtenue permet souvent de repérer une erreur.";
  if (s < NQ && CONFIG.mode === 'lettres') c += " Pour contrôler une réponse, remplacer les lettres par des nombres simples et vérifier que la relation de départ reste vraie.";
  return c;
}

function showEnd() {
  const score = state.answers.filter(a => a.ok).length;
  const ms = chrono.ms();
  chrono.stop();
  show('end');
  els.count.textContent = 'Résultat';
  math(els.score, '\\dfrac{' + score + '}{' + NQ + '}', score + ' / ' + NQ);
  const bat = !record || score > record.score || (score === record.score && ms < record.ms);
  dernier = { score, ms, bat, avant: record };
  if (bat) record = { score, ms };
  afficherTemps();
  const reussies = state.answers.map((a, k) => a.ok ? k + 1 : 0).filter(Boolean);
  els.palier.textContent = '';
  if (reussies.length) {
    const haut = Math.max(...reussies);
    const b = document.createElement('strong');
    b.textContent = haut === NQ ? 'La dernière marche, la plus difficile, est franchie.' : 'Marche la plus haute franchie : ' + haut + ' sur ' + NQ + '.';
    els.palier.appendChild(b);
    if (state.meilleureSerie >= 2) els.palier.appendChild(document.createTextNode(' Meilleure série : ' + state.meilleureSerie + ' réponses justes d’affilée.'));
  }
  els.comment.textContent = commentFor(score);

  const wrong = state.answers.filter(a => !a.ok);
  els.recap.innerHTML = '';
  els.recap.hidden = wrong.length === 0;
  if (wrong.length) {
    const h = document.createElement('h2');
    h.textContent = wrong.length === 1 ? 'L’erreur à revoir' : 'Les erreurs à revoir (' + wrong.length + ')';
    els.recap.appendChild(h);
    wrong.forEach(a => {
      const good = a.q.options.find(o => o.ok);
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML =
        (a.q.label ? '<div class="ctx"></div>' : '') +
        '<div class="rel"></div>' +
        '<div class="comp">' +
          '<div class="box bad-box"><span class="lab">Réponse donnée</span><span class="m bad"></span></div>' +
          '<div class="box good-box"><span class="lab">Réponse attendue</span><span class="m good"></span></div>' +
        '</div>';
      if (a.q.label) contexte(item.querySelector('.ctx'), a.q);
      math(item.querySelector('.rel'), a.q.relTex, a.q.relTxt);
      ajuster(item.querySelector('.rel'));
      if (a.chosen) math(item.querySelector('.bad'), a.chosen.tex, a.chosen.txt);
      else item.querySelector('.bad').textContent = 'Je ne sais pas';
      math(item.querySelector('.good'), good.tex, good.txt);
      renderSteps(item, a.q, a.chosen);
      els.recap.appendChild(item);
    });
  }
  els.restart.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}

function afficherTemps() {
  els.times.textContent = '';
  if (!dernier || !chrono.visible) return;
  const ligne = document.createElement('span');
  ligne.textContent = duree(dernier.ms) + ', soit ' + moyenne(dernier.ms / NQ) + ' par question.';
  els.times.appendChild(ligne);
  if (!dernier.avant) return;
  els.times.appendChild(document.createElement('br'));
  const rec = document.createElement('span');
  rec.className = dernier.bat ? 'record' : '';
  rec.textContent = dernier.bat
    ? 'Nouveau record de la séance.'
    : 'Record de la séance : ' + dernier.avant.score + ' / ' + NQ + ' en ' + duree(dernier.avant.ms) + '.';
  els.times.appendChild(rec);
}

function majToggle() {
  els.chronoToggle.textContent = chrono.visible ? 'Masquer le chronomètre' : 'Afficher le chronomètre';
}
els.chronoToggle.addEventListener('click', () => {
  chrono.visible = !chrono.visible;
  chrono.afficher();
  afficherTemps();
  majToggle();
});
majToggle();

$('dunno').addEventListener('click', () => answer(-1));
els.next.addEventListener('click', next);
els.restart.addEventListener('click', start);

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!els.screenQ.hidden) {
    if (!state.locked && ['1', '2', '3'].includes(e.key)) { answer(Number(e.key) - 1); return; }
    if (!state.locked && (e.key === '0' || e.key === '?')) { answer(-1); return; }
    const nextVisible = state.locked && !els.next.hidden;
    if (nextVisible && e.key === 'ArrowRight') next();
    if (nextVisible && (e.key === 'Enter' || e.key === ' ') && document.activeElement !== els.next) { e.preventDefault(); next(); }
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const md = new URLSearchParams(location.search).get('mode');
  if (md === 'lettres' || md === 'physique') CONFIG.mode = md;
  const sl = new URLSearchParams(location.search).get('surlignage');
  if (sl === 'feutre' || sl === 'discret') CONFIG.surlignage = sl;
  document.body.classList.toggle('surlignage-discret', CONFIG.surlignage === 'discret');
  const n = new URLSearchParams(location.search).get('niveau');
  if (n) {
    const choix = n.split(',').map(x => x.trim()).filter(x => ['2de', '1re', 'Tle'].includes(x));
    if (choix.length) CONFIG.niveaux = choix;
  }
  start();
});
</script>
