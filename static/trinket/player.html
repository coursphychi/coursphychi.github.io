<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code runner</title>
<script>
  /* Thème appliqué AVANT le premier affichage (évite un flash blanc) :
     le shortcode ajoute ?theme=dark|auto à l'adresse du player. */
  (function(){
    var m = /[?&]theme=(dark|auto)\b/.exec(location.search);
    if (!m) return;
    var dark = m[1] === "dark" || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    if (dark) document.documentElement.classList.add("tk-dark");
  })();
</script>
<style>
  /* ===================================================================
     Fenêtre épurée — inspirée de Trinket, sans le branding.
     Les couleurs passent par des variables CSS faciles à personnaliser.
  =================================================================== */
  :root{
    --tk-border:#d8dde3;
    --tk-bg:#ffffff;
    --tk-bar:#f5f7f9;
    --tk-text:#1f2933;
    --tk-muted:#6b7682;
    --tk-accent:#2b7a4b;       /* vert "exécuter" */
    --tk-accent-hover:#246b41;
    --tk-stop:#d14b3d;         /* rouge "arrêter" */
    --tk-input:#1971c2;        /* bleu de la saisie console (façon Trinket) */
    --tk-tab-active:#ffffff;
    --tk-error:#c0392b;
    --tk-warn:#b26a00;                    /* avertissements (warnings) */
    --tk-hover:rgba(15,23,32,.06);        /* survol des boutons discrets */
    --tk-hover-strong:rgba(15,23,32,.08);
    --tk-subtle:rgba(0,0,0,.04);          /* fonds très légers (en-têtes de fichiers) */
    --tk-subtle-hover:rgba(0,0,0,.03);
    --tk-activeline:#e8f2ff;              /* ligne du curseur dans l'éditeur (bleu pâle) */
    --tk-activeline-gutter:#e4e8ee;
    --tk-errline:rgba(209,75,61,.12);     /* ligne fautive */
    color-scheme:light;
    --tk-radius:8px;
    --tk-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --tk-mono: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent}
  body{font-family:var(--tk-font);color:var(--tk-text)}

  .tk{
    display:flex;flex-direction:column;height:100vh;
    border:1px solid var(--tk-border);border-radius:var(--tk-radius);
    overflow:hidden;background:var(--tk-bg);
  }

  /* Barre d'outils */
  .tk-bar{
    display:flex;align-items:stretch;gap:0;
    background:var(--tk-bar);border-bottom:1px solid var(--tk-border);
    min-height:40px;
  }
  .tk-tabs{display:flex}
  .tk-tab{
    appearance:none;border:0;background:transparent;cursor:pointer;
    padding:0 16px;font-size:13px;color:var(--tk-muted);
    border-right:1px solid var(--tk-border);transition:color .15s ease, background .15s ease;
  }
  .tk-tab:hover{color:var(--tk-text)}
  .tk-tab.is-active{background:var(--tk-tab-active);color:var(--tk-text);font-weight:600;
    box-shadow:inset 0 -2px 0 var(--tk-accent)}
  .tk-spacer{flex:1}

  /* Boutons icône ronds (Exécuter / Arrêter) */
  .tk-iconbtn{
    appearance:none;border:0;cursor:pointer;padding:0;
    align-self:center;margin-right:8px;
    width:30px;height:30px;border-radius:50%;
    display:none;align-items:center;justify-content:center;
    color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);
    transition:background .15s ease, filter .15s ease, transform .06s ease, opacity .15s ease;
  }
  .tk-iconbtn svg{width:14px;height:14px;fill:currentColor;display:block}
  .tk-iconbtn:active{transform:scale(.9)}
  .tk-run{display:flex;background:var(--tk-accent)}
  .tk-run:hover{background:var(--tk-accent-hover)}
  .tk-run[disabled]{opacity:.4;cursor:default;box-shadow:none}
  .tk-stop{background:var(--tk-stop)}
  .tk-stop.is-visible{display:flex}
  .tk-stop:hover{filter:brightness(.92)}

  /* Bouton secondaire discret (Copier le code) */
  .tk-ghostbtn{
    appearance:none;cursor:pointer;align-self:center;margin-right:6px;
    width:30px;height:30px;border-radius:7px;border:1px solid transparent;
    background:transparent;color:var(--tk-muted);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .tk-ghostbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;display:block}
  .tk-ghostbtn:hover{background:var(--tk-hover);color:var(--tk-text)}
  .tk-ghostbtn:active{transform:scale(.94)}
  .tk-ghostbtn.is-done{color:var(--tk-accent)}

  /* Import de fichiers : bande d'étiquettes sous la barre, zone de dépôt */
  .tk-uploads{display:flex;flex-wrap:wrap;align-items:center;gap:6px;
    padding:6px 10px;border-bottom:1px solid var(--tk-border);background:var(--tk-bg);font-size:12.5px}
  .tk-uploads[hidden]{display:none}
  .tk-chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;
    padding:2px 3px 2px 8px;border:1px solid var(--tk-border);border-radius:999px;
    background:var(--tk-bar);color:var(--tk-text)}
  .tk-chip svg{width:14px;height:14px;flex:none;fill:none;stroke:var(--tk-muted);stroke-width:1.5;stroke-linejoin:round}
  .tk-chip-name{font-family:var(--tk-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tk-chip small{color:var(--tk-muted);white-space:nowrap}
  .tk-chip button{appearance:none;border:0;background:transparent;cursor:pointer;color:var(--tk-muted);
    width:20px;height:20px;border-radius:50%;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
  .tk-chip button:hover{background:var(--tk-hover-strong);color:var(--tk-text)}
  .tk-chip button:focus-visible{outline:2px solid var(--tk-accent);outline-offset:1px}
  .tk-upmsg{color:var(--tk-error)}
  .tk.is-drop{outline:2px dashed var(--tk-accent);outline-offset:-6px}
  .tk.is-drop .tk-body{opacity:.55}

  /* Focus clavier visible et homogène */
  .tk-tab:focus-visible,.tk-iconbtn:focus-visible,.tk-ghostbtn:focus-visible{
    outline:2px solid var(--tk-accent);outline-offset:2px;
  }

  /* Zones */
  .tk-body{flex:1;position:relative;overflow:hidden}
  .tk-pane{position:absolute;inset:0;overflow:auto}
  .tk-pane[hidden]{display:none}

  /* Éditeur */
  .tk-editor textarea{
    width:100%;height:100%;border:0;resize:none;outline:none;padding:10px 12px;
    font-family:var(--tk-mono);font-size:13.5px;line-height:1.5;color:var(--tk-text);
    tab-size:4;
  }
  .CodeMirror{height:100% !important;font-family:var(--tk-mono);font-size:13.5px;line-height:1.3}
  /* height="auto" : l'éditeur prend la hauteur de son contenu */
  .tk.is-autoh .CodeMirror{height:auto !important}
  /* ligne active (curseur) surlignée en gris, façon Trinket */
  /* ".CodeMirror " en préfixe : codemirror.css (chargé APRÈS ce style) impose sa
     propre couleur (#e8f2ff) avec la même priorité ; il faut être plus spécifique. */
  .CodeMirror .CodeMirror-activeline-background{background:var(--tk-activeline)}
  .CodeMirror .CodeMirror-activeline-gutter{background:var(--tk-activeline-gutter)}

  /* Sortie */
  .tk-out{padding:10px 12px}
  .tk-stdout{margin:0;font-family:var(--tk-mono);font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  /* Saisie input() façon Trinket : inline dans la console, texte bleu, sans
     cadre, avec un curseur bloc clignotant (pas le caret natif). */
  .tk-inwrap{white-space:pre;position:relative}
  .tk-instyle{color:var(--tk-input)}      /* saisie / valeur, en bleu, dans le flux */
  .tk-caret{display:inline-block;width:0.6em;height:1.1em;background:var(--tk-muted);
    vertical-align:text-bottom;animation:tk-blink 1.05s steps(1,start) infinite}
  @keyframes tk-blink{50%{opacity:0}}
  /* Le champ réel est invisible : il ne sert qu'à capter la frappe et le focus.
     L'affichage est fait par le span .tk-instyle → aucun rognage ni défilement. */
  .tk-stdin{position:absolute;left:0;top:0;width:1px;height:1em;opacity:0;
    border:0;padding:0;margin:0;background:transparent;color:transparent;
    outline:none;font:inherit}
  .tk-canvas{display:flex;justify-content:center}
  /* Pyodide : figures matplotlib insérées dans le flux de la console */
  .tk-plot{display:block;max-width:100%;height:auto;margin:8px 0;
    background:#fff;border-radius:6px}
  .tk-stderr{color:var(--tk-warn)}                 /* avertissements (warnings) : orangé, pas rouge */
  .tk-status{font-family:var(--tk-font);font-size:12.5px;color:var(--tk-muted);
    margin-bottom:8px;animation:tk-pulse 1.6s ease-in-out infinite}
  @keyframes tk-pulse{50%{opacity:.45}}
  .tk-error{color:var(--tk-error);font-family:var(--tk-mono);font-size:13px;white-space:pre-wrap;margin-top:6px}
  .tk-error.is-clickable{cursor:pointer}
  .tk-error.is-clickable:hover{text-decoration:underline;text-underline-offset:2px}
  /* marqueur d'erreur : point rouge dans la gouttière + surlignage de la ligne */
  .CodeMirror .tk-err-gutter{width:14px}
  .tk-err-dot{display:block;width:8px;height:8px;margin:5px auto 0;border-radius:50%;background:var(--tk-stop)}
  .CodeMirror .tk-err-line{background:var(--tk-errline)}

  @media (prefers-reduced-motion: reduce){
    .tk-caret,.tk-status{animation:none}
    .tk-iconbtn,.tk-ghostbtn,.tk-tab{transition:none}
  }
  /* Fichiers générés (open()/write) : reproduit l'onglet "fichier" de Trinket */
  .tk-files{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .tk-file{border:1px solid var(--tk-border);border-radius:6px;overflow:hidden}
  .tk-file-head{display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:4px 8px;background:var(--tk-subtle);border-bottom:1px solid var(--tk-border)}
  .tk-file-name{font-family:var(--tk-mono);font-size:12.5px;color:var(--tk-muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tk-file-copy{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--tk-border);
    background:var(--tk-bg);border-radius:5px;padding:2px 10px;color:var(--tk-accent)}
  .tk-file-copy:hover{background:var(--tk-subtle-hover)}
  .tk-file-btns{display:flex;gap:6px;flex:0 0 auto}
  .tk-file-content{display:block;width:100%;box-sizing:border-box;border:0;resize:vertical;
    font-family:var(--tk-mono);font-size:12.5px;line-height:1.4;padding:6px 8px;min-height:54px;
    max-height:240px;background:var(--tk-bg);color:inherit;white-space:pre}
  /* VPython : le canvas est dimensionné NATIVEMENT (via la largeur du conteneur),
     jamais par transform CSS — sinon le calcul de la souris par GlowScript est
     faussé. La fenêtre épouse ensuite la taille réelle du contenu. */
  .tk-out.is-vpython{padding:0}
  .tk-out.is-vpython .tk-canvas{display:block;overflow:visible}
  .gs-fit .glowscript{display:flow-root}

  /* État de chargement */
  .tk-loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--tk-muted);font-size:13px}

  /* ===================================================================
     THÈME SOMBRE (theme="dark", ou "auto" quand le système est en sombre)
     Activé par la classe tk-dark sur <html>. Mêmes variables, autres valeurs.
  =================================================================== */
  html.tk-dark{
    --tk-border:#2e353d;
    --tk-bg:#16191d;
    --tk-bar:#1d2127;
    --tk-text:#e3e7ec;
    --tk-muted:#8d96a0;
    --tk-accent:#2f9e5f;
    --tk-accent-hover:#36ad69;
    --tk-stop:#e0584c;
    --tk-input:#6cb6ff;
    --tk-tab-active:#16191d;
    --tk-error:#ff7b72;
    --tk-warn:#d9a54a;
    --tk-hover:rgba(255,255,255,.07);
    --tk-hover-strong:rgba(255,255,255,.10);
    --tk-subtle:rgba(255,255,255,.04);
    --tk-subtle-hover:rgba(255,255,255,.06);
    --tk-activeline:#1f242b;
    --tk-activeline-gutter:#232931;
    --tk-errline:rgba(224,88,76,.20);
    color-scheme:dark;                   /* barres de défilement, champs natifs */
  }
  /* figures matplotlib : on garde leur fond blanc, posé comme une carte */
  html.tk-dark .tk-plot{box-shadow:0 0 0 1px var(--tk-border)}

  /* Éditeur CodeMirror : thème « tkdark » (couleurs inspirées de One Dark) */
  .cm-s-tkdark.CodeMirror{background:var(--tk-bg);color:#d7dce2}
  .cm-s-tkdark .CodeMirror-gutters{background:var(--tk-bar);border-right:1px solid var(--tk-border)}
  .cm-s-tkdark .CodeMirror-linenumber{color:#6e7883}
  .cm-s-tkdark .CodeMirror-activeline-gutter .CodeMirror-linenumber{color:#aab3bd}
  .cm-s-tkdark .CodeMirror-cursor{border-left:2px solid #e3e7ec}
  .cm-s-tkdark div.CodeMirror-selected{background:#2b3440}
  .cm-s-tkdark.CodeMirror-focused div.CodeMirror-selected{background:#304256}
  .cm-s-tkdark .CodeMirror-line::selection,.cm-s-tkdark .CodeMirror-line > span::selection,
  .cm-s-tkdark .CodeMirror-line > span > span::selection{background:#304256}
  .cm-s-tkdark .cm-keyword{color:#c678dd}
  .cm-s-tkdark .cm-def{color:#61afef}
  .cm-s-tkdark .cm-builtin{color:#56b6c2}
  .cm-s-tkdark .cm-variable{color:#d7dce2}
  .cm-s-tkdark .cm-variable-2{color:#e5c07b}
  .cm-s-tkdark .cm-property{color:#e06c75}
  .cm-s-tkdark .cm-number,.cm-s-tkdark .cm-atom{color:#d19a66}
  .cm-s-tkdark .cm-string,.cm-s-tkdark .cm-string-2{color:#98c379}
  .cm-s-tkdark .cm-comment{color:#86909b;font-style:italic}
  .cm-s-tkdark .cm-operator{color:#56b6c2}
  .cm-s-tkdark .cm-meta{color:#e5c07b}
  .cm-s-tkdark .cm-bracket,.cm-s-tkdark .cm-punctuation{color:#abb2bf}
  .cm-s-tkdark .cm-error{color:#ff7b72}
  .cm-s-tkdark .CodeMirror-matchingbracket{color:#e3e7ec !important;background:#3a4450;outline:1px solid #5a6674}
  .cm-s-tkdark .CodeMirror-nonmatchingbracket{color:#ff7b72 !important}
</style>
</head>
<body>
  <div class="tk" id="tk-root">
    <div class="tk-bar" id="tk-bar"></div>
    <div class="tk-body" id="tk-body">
      <div class="tk-loading" id="tk-boot">…</div>
    </div>
  </div>

<script>
/* =====================================================================
   CONFIGURATION DES BIBLIOTHÈQUES
   ---------------------------------------------------------------------
   • Skulpt et CodeMirror sont par défaut sur CDN (fiable, fonctionne tout
     de suite). Tu peux les rapatrier en local pour t'affranchir totalement
     des services tiers : voir le README.
   • GlowScript n'a PAS de CDN officiel : il DOIT être auto-hébergé.
     Place le dossier glowscript_libraries/ (issu de GlowScriptOffline3.2.zip)
     dans  static/trinket/glowscript_libraries/.
===================================================================== */
var LIBS = {
  // Skulpt (moteur Python). On essaie les sources dans l'ordre : d'abord une
  // copie AUTO-HÉBERGÉE (la plus fiable — fonctionne hors-ligne et derrière un
  // proxy d'établissement), puis le CDN en secours si le local est absent.
  // Pour auto-héberger : place skulpt.min.js et skulpt-stdlib.js dans
  //   static/trinket/skulpt_libraries/        (voir le README).
  skulpt:       ["skulpt_libraries/skulpt.min.js",
                 "https://cdn.jsdelivr.net/gh/Tezumie/Skulpt-CDN@latest/skulpt.min.js"],
  skulptStdlib: ["skulpt_libraries/skulpt-stdlib.js",
                 "https://cdn.jsdelivr.net/gh/Tezumie/Skulpt-CDN@latest/skulpt-stdlib.js"],

  // Pyodide (lang="pyodide") : vrai CPython en WebAssembly + numpy, matplotlib…
  // Version ÉPINGLÉE (jamais "latest") pour qu'une mise à jour ne casse rien.
  // Pour changer de version : remplacer 314.0.7 ci-dessous (voir pyodide.org).
  pyodide: ["https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"],

  // Paquets PyPI (Python PUR) absents de Pyodide, installés automatiquement
  // (via micropip) quand le code les importe. Forme : { nom_importé: "nom_PyPI" }.
  // Liste blanche volontaire : on n'installe PAS n'importe quel nom tapé dans
  // l'éditeur (une faute de frappe pourrait tirer un paquet malveillant homonyme).
  // Pour un besoin ponctuel, préférer le paramètre packages="…" du shortcode.
  pypiAuto: { seaborn: "seaborn" },

  cmCss: "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css",
  cmJs:  "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js",
  cmPy:  "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js",
  cmActiveLine: "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js",
  cmCloseBrackets: "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js",
  cmMatchBrackets: "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js",

  gsBase:    "glowscript_libraries/",   // relatif à player.html → /trinket/glowscript_libraries/
  gsVersion: "3.2",                     // version GlowScript par défaut (surchargée par version="…" du shortcode)

  // VPython : largeur de mise en page par défaut quand le shortcode ne fournit
  // pas width=. La scène ne dépasse jamais cette valeur (ni la place disponible).
  // 0 = pas de plafond (la scène occupe toute la largeur disponible).
  vpDefaultWidth: 640
};

/* Icônes SVG (trait fin, style épuré, héritent de currentColor) */
var ICONS = {
  copy:    '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="9" height="11" rx="2"/><path d="M4 13H3.5A1.5 1.5 0 0 1 2 11.5v-7A1.5 1.5 0 0 1 3.5 3h7A1.5 1.5 0 0 1 12 4.5V5"/></svg>',
  check:   '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>',
  upload:  '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3.5M6.5 7L10 3.5 13.5 7M4 12.5v3A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5v-3"/></svg>',
  file:    '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11.5 2.5H6A1.5 1.5 0 0 0 4.5 4v12A1.5 1.5 0 0 0 6 17.5h8a1.5 1.5 0 0 0 1.5-1.5V6.5z"/><path d="M11.5 2.5v4h4"/></svg>'
};

/* ---------- utilitaires ---------- */
function el(tag, attrs, children){
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}
function b64ToUtf8(b64){
  try { return decodeURIComponent(escape(window.atob(b64))); }
  catch(e){ return window.atob(b64); }
}
var _loaded = {};
function loadScript(url){
  if (_loaded[url]) return _loaded[url];
  _loaded[url] = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = url; s.async = false;
    s.onload = function(){ res(url); };
    s.onerror = function(){ rej(new Error("Échec du chargement : " + url)); };
    document.head.appendChild(s);
  });
  return _loaded[url];
}
function loadScriptsSequential(urls){
  return urls.reduce(function(p, u){ return p.then(function(){ return loadScript(u); }); }, Promise.resolve());
}
// Essaie plusieurs sources dans l'ordre ; la 1ʳᵉ qui se charge l'emporte.
// (URL unique acceptée aussi.) → auto-hébergement prioritaire, CDN en secours.
function loadFirst(urls){
  var list = [].concat(urls), i = 0;
  return new Promise(function(res, rej){
    (function next(){
      if (i >= list.length){ rej(new Error("aucune source disponible")); return; }
      loadScript(list[i++]).then(res, next);
    })();
  });
}
function loadCss(url){
  return new Promise(function(res){
    var l = document.createElement("link");
    l.rel = "stylesheet"; l.href = url; l.onload = res; l.onerror = res;
    document.head.appendChild(l);
  });
}

/* =====================================================================
   ÉTAT + INITIALISATION
   Priorité 1 : configuration lue dans le hash de l'URL (#<base64url>).
                Robuste : aucun script parent requis, immunisé contre
                reveal.js / Markdown / CSP inline.
   Priorité 2 : postMessage (secours, ex. très gros programmes).
===================================================================== */
var CFG = null, editor = null;
var els = {};

function applyCfg(cfg, codeIsB64){
  if (CFG || !cfg) return;             // une seule initialisation
  CFG = cfg;
  if (codeIsB64) CFG.code = b64ToUtf8(CFG.code || "");
  init();
}
function b64urlToUtf8(s){
  s = String(s).replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return b64ToUtf8(s);
}
function readHashCfg(){
  var h = location.hash ? location.hash.slice(1) : "";
  if (!h) return null;
  try { return JSON.parse(b64urlToUtf8(h)); } catch(e){ return null; }
}

// Secours : configuration transmise par le script parent (thèmes classiques)
window.addEventListener("message", function(e){
  var d = e.data;
  if (d && d.__trinket && d.cfg) applyCfg(d.cfg, true);
});
// reveal.js prévient l'iframe quand sa slide devient visible / masquée
window.addEventListener("message", function(e){
  if (e.data === "slide:start") onSlideVisible();
});

// Priorité 1 : le hash. Démarrage appelé À LA FIN du script (voir boot() tout
// en bas) : toutes les variables « var x = … » sont alors initialisées. Démarrer
// ici laisserait valoir undefined celles déclarées plus bas pendant init().
function boot(){
  var hashCfg = readHashCfg();
  if (hashCfg) {
    applyCfg(hashCfg, false);
  } else {
    // pas de hash : on signale au parent qu'on attend une config par message
    try { parent.postMessage({ __trinket_ready: true }, "*"); } catch(e){}
  }
}

function init(){
  var lang = (CFG.lang || "python").toLowerCase();
  var mode = (CFG.mode || "toggle").toLowerCase();
  var dv   = (CFG.default || CFG.defaultView || "code").toLowerCase();
  CFG.lang = (lang === "vpython" || lang === "glowscript") ? "vpython"
           : (lang === "pyodide") ? "pyodide" : "python";
  CFG.mode = (mode === "output" || mode === "output-only") ? "output" : "toggle";
  CFG.defaultView = (dv === "output" || dv === "result" || dv === "résultat" || dv === "resultat") ? "output" : "code";
  CFG.width = parseInt(CFG.width, 10) || 0;   // 0 = largeur auto (fenêtre épouse la scène)
  CFG.fit = ((CFG.fit || "scale") + "").toLowerCase() === "native" ? "native" : "scale";
  CFG.version = /^[0-9]\.[0-9]$/.test((CFG.version || "") + "") ? ("" + CFG.version) : "";
  // height="auto" : la fenêtre épouse la hauteur du code (mode toggle uniquement)
  CFG.autoheight = (CFG.autoheight === true || CFG.autoheight === "true") && CFG.mode === "toggle";
  // packages="seaborn, uncertainties" : paquets PyPI à installer (lang="pyodide")
  CFG.packages = (Array.isArray(CFG.packages) ? CFG.packages : String(CFG.packages || "").split(/[\s,;]+/))
    .filter(function(x){ return /^[A-Za-z0-9][A-Za-z0-9._-]*([<>=!~]=?[A-Za-z0-9.*]+)?$/.test(x); });
  // data : fichiers de données fournis par le shortcode → { nom: contenu }
  var _d = CFG.data, _obj = {};
  if (Array.isArray(_d)) _d.forEach(function(x){ if (x && x.n) _obj[String(x.n)] = String(x.c == null ? "" : x.c); });
  else if (_d && typeof _d === "object") for (var _k in _d) _obj[_k] = String(_d[_k]);
  CFG.data = _obj;
  // upload : "" (aucun) | "auto" (upload="true") | liste d'extensions (".csv,.txt")
  var _up = CFG.upload;
  _up = (_up === true || _up === "true" || _up === "auto") ? "auto"
      : (!_up || _up === "false") ? "" : String(_up);
  CFG.upload = (CFG.lang === "vpython") ? "" : _up;
  // theme : "light" (défaut) | "dark" | "auto" (suit le réglage du système)
  var _th = String(CFG.theme || (/[?&]theme=(\w+)/.exec(location.search) || [])[1] || "light").toLowerCase();
  CFG.theme = (_th === "dark" || _th === "auto") ? _th : "light";
  setupTheme();
  var _root = document.getElementById("tk-root");
  if (_root) _root.classList.toggle("is-autoh", CFG.autoheight);

  buildUI();
  // exécution initiale : uniquement si autorun="true" est demandé explicitement
  if (!CFG.idle && CFG.autorun) run();
}

function buildUI(){

  var body = document.getElementById("tk-body");
  bar.innerHTML = ""; body.innerHTML = "";

  // --- panneaux ---
  var editorPane = el("div", {class:"tk-pane tk-editor"});

  ta.value = CFG.code;
  editorPane.appendChild(ta);

  var outPane = el("div", {class:"tk-pane tk-out"});
  var stdout  = el("pre", {class:"tk-stdout"});
  var canvas  = el("div", {class:"tk-canvas", id:"tk-canvas"});
  var errBox  = el("div", {class:"tk-error"});
  var files   = el("div", {class:"tk-files"});
  files.hidden = true;
  outPane.appendChild(canvas);
  outPane.appendChild(stdout);
  outPane.appendChild(errBox);
  outPane.appendChild(files);

  body.appendChild(editorPane);
  body.appendChild(outPane);

  var strip = el("div", {class:"tk-uploads", "aria-label":"Fichiers importés"});
  strip.hidden = true;
  document.getElementById("tk-root").insertBefore(strip, body);   // entre la barre et le code
  els.uploads = strip;
  watchOutput();                         // hauteur adaptée à la sortie (python / pyodide)

  // --- barre ---
  if (CFG.mode === "toggle"){
    var tabs = el("div", {class:"tk-tabs"});
    var tabCode = el("button", {class:"tk-tab is-active"}, ["Code"]);

    tabs.appendChild(tabCode); tabs.appendChild(tabOut);
    bar.appendChild(tabs);
    bar.appendChild(el("div", {class:"tk-spacer"}));

    function show(which){
      var code = which === "code";
      els.editorPane.hidden = !code;
      els.outPane.hidden = code;
      tabCode.classList.toggle("is-active", code);
      tabOut.classList.toggle("is-active", !code);
      if (code && editor) setTimeout(function(){ editor.refresh(); }, 0);
      if (CFG.lang === "vpython"){
        if (CFG.autoheight){
          if (code){ _lastCodeH = -1; setTimeout(scheduleCodeFit, 0); }   // re-épouser le code
          else { _lastOutW = -1; _lastOutH = -1; scheduleFit(); }         // la scène reprend sa taille
        }
      } else {
        if (code) setTimeout(restoreCodeHeight, 0);   // hauteur d'origine (ou du code en "auto")
        else scheduleOutFit();                        // la fenêtre épouse la sortie
      }
    }
    tabCode.onclick = function(){ show("code"); };
    tabOut.onclick  = function(){ show("out"); };
    els.show = show;
    show(CFG.defaultView === "output" ? "out" : "code");
  } else {
    // output only : pas d'onglets, pas d'éditeur visible
    els.editorPane.hidden = true;
    bar.appendChild(el("div", {class:"tk-spacer"}));
  }

  // --- boutons secondaires (style discret) ---
  setupUpload(bar);                      // import de fichiers (upload="true")
  if (CFG.mode === "toggle"){
    var copyBtn = el("button", {class:"tk-ghostbtn tk-copy", title:"Copier le code", "aria-label":"Copier le code"});
    copyBtn.innerHTML = ICONS.copy;
    copyBtn.onclick = function(){
      copyText(currentCode()).then(function(){
        copyBtn.classList.add("is-done");
        copyBtn.innerHTML = ICONS.check;
        copyBtn.title = "Code copié"; copyBtn.setAttribute("aria-label", "Code copié");
        clearTimeout(copyBtn._t);
        copyBtn._t = setTimeout(function(){
          copyBtn.classList.remove("is-done");
          copyBtn.innerHTML = ICONS.copy;
          copyBtn.title = "Copier le code"; copyBtn.setAttribute("aria-label", "Copier le code");
        }, 1500);
      });
    };
    bar.appendChild(copyBtn);
    els.copyBtn = copyBtn;
  }

  var stopBtn = el("button", {class:"tk-iconbtn tk-stop", title:"Arrêter", "aria-label":"Arrêter"});
  stopBtn.innerHTML = '<svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="2"/></svg>';
  stopBtn.onclick = stopRun;
  bar.appendChild(stopBtn);
  els.stopBtn = stopBtn;

  var runBtn = el("button", {class:"tk-iconbtn tk-run", title:"Exécuter", "aria-label":"Exécuter"});
  runBtn.innerHTML = '<svg viewBox="0 0 16 16"><path d="M5 3.4c0-.5.5-.8 1-.6l6.5 4.1c.4.3.4.9 0 1.2L5.9 12.2c-.4.3-.9 0-.9-.6z"/></svg>';
  runBtn.onclick = run;
  bar.appendChild(runBtn);
  els.runBtn = runBtn;

  // éditeur enrichi (CodeMirror) uniquement en mode toggle
  if (CFG.mode === "toggle"){
    loadCss(LIBS.cmCss)
      .then(function(){ return loadScript(LIBS.cmJs); })
      .then(function(){ return loadScript(LIBS.cmPy); })
      .then(function(){ return loadScript(LIBS.cmActiveLine); })
      .then(function(){ return loadScript(LIBS.cmCloseBrackets); })
      .then(function(){ return loadScript(LIBS.cmMatchBrackets); })
      .then(function(){
        editor = window.CodeMirror.fromTextArea(ta, {
          mode: "python", lineNumbers: true, indentUnit: 4, tabSize: 4,
          indentWithTabs: false, lineWrapping: false, viewportMargin: Infinity,
          theme: isDark() ? "tkdark" : "default",
          styleActiveLine: true,      // surligne la ligne du curseur (façon Trinket)
          autoCloseBrackets: true,    // ferme automatiquement ( [ { " '
          matchBrackets: true,        // met en évidence la parenthèse jumelle
          smartIndent: true,          // indentation automatique après ":" etc.
          electricChars: true,
          // gouttière dédiée au marqueur d'erreur (point rouge), à gauche des numéros
          gutters: ["tk-err-gutter", "CodeMirror-linenumbers"]
        });
        editor.setSize("100%", CFG.autoheight ? "auto" : "100%");
        if (CFG.autoheight){
          editor.on("change", scheduleCodeFit);   // la fenêtre suit la saisie
          scheduleCodeFit();
        }
      })
      .catch(function(){ /* on garde le textarea brut si CodeMirror échoue */
        _cmFailed = true; scheduleCodeFit();
      });
  }
}

function currentCode(){
  return editor ? editor.getValue() : els.ta.value;
}
function clearOutput(){
  els.stdout.textContent = "";
  els.canvas.innerHTML = "";
  els.errBox.textContent = "";
  if (els.files){ els.files.innerHTML = ""; els.files.hidden = true; }
  clearErrorMarks();
}
function showError(msg){ els.errBox.textContent = msg; }

var _errLine = null;
function clearErrorMarks(){
  if (editor && _errLine != null){
    try { editor.clearGutter("tk-err-gutter"); editor.removeLineClass(_errLine, "background", "tk-err-line"); } catch(e){}
  }
  _errLine = null;
  if (els && els.errBox){ els.errBox.classList.remove("is-clickable"); els.errBox.onclick = null; els.errBox.removeAttribute("title"); }
}
// Erreur Python lisible : numéro de ligne en français + (si éditeur présent)
// point rouge dans la gouttière et surlignage de la ligne fautive. Cliquer sur
// le message renvoie à la bonne ligne dans l'onglet Code.
// `pre` (optionnel, Pyodide) = { text, line } déjà nettoyés ; sinon erreur Skulpt.
function showPyError(err, pre){
  var s, lineNo;
  if (pre){ s = pre.text; lineNo = pre.line; }
  else {
    s = formatPyError(err);
    var m = s.match(/line (\d+)/);
    lineNo = m ? parseInt(m[1], 10) : null;
  }
  els.errBox.textContent = s.replace(/\bon line (\d+)/g, "(ligne $1)").replace(/\bline (\d+)/g, "ligne $1");
  if (editor && lineNo && lineNo >= 1){
    var idx = lineNo - 1;
    clearErrorMarks();
    var dot = el("span", {class:"tk-err-dot", "aria-hidden":"true"});
    try {
      editor.setGutterMarker(idx, "tk-err-gutter", dot);
      editor.addLineClass(idx, "background", "tk-err-line");
      _errLine = idx;
    } catch(e){}
    els.errBox.classList.add("is-clickable");
    els.errBox.title = "Aller à la ligne " + lineNo;
    els.errBox.onclick = function(){
      if (els.show) els.show("code");
      try { editor.setCursor(idx, 0); editor.focus(); editor.scrollIntoView({line: idx, ch: 0}, 120); } catch(e){}
    };
  }
}

var _running = false, _vpStarted = false;
function setRunning(on){
  _running = on;
  if (els.runBtn)  els.runBtn.disabled = on;
  if (els.stopBtn) els.stopBtn.classList.toggle("is-visible", on);
  if (!on) scheduleOutFit();             // programme terminé : ajustement exact à la sortie
}
// Re-lancer en rechargeant l'iframe : repart d'un état GlowScript propre.
// Indispensable car relancer un programme VPython pendant qu'un autre tourne
// encore corrompt l'état interne de GlowScript (erreur "L.match", etc.).
// Configuration COMPLÈTE retransmise lors d'un rechargement (Stop, relance) :
// tout paramètre oublié ici serait perdu après un clic sur ■ ou ▶.
function reloadWith(extra){
  var next = {
    code: currentCode(),
    lang: CFG.lang, mode: CFG.mode, "default": CFG.defaultView,
    width: CFG.width, fit: CFG.fit, version: CFG.version,
    autoheight: CFG.autoheight, packages: CFG.packages, data: CFG.data, upload: CFG.upload, theme: CFG.theme
  };
  for (var k in extra) next[k] = extra[k];
  try { location.hash = utf8ToB64url(JSON.stringify(next)); } catch(e){}
  location.reload();
}
function rerunViaReload(){ reloadWith({ autorun: true }); }
function run(){
  // un programme tourne déjà, ou VPython a déjà été lancé une fois → on repart propre
  if (_running || (CFG.lang === "vpython" && _vpStarted)) { rerunViaReload(); return; }
  clearOutput();
  if (els.show) els.show("out");        // bascule sur Résultat en mode toggle
  els.outPane.classList.toggle("is-vpython", CFG.lang === "vpython");
  setRunning(true);
  var done = function(){ setRunning(false); };
  var code = currentCode();
  if (CFG.lang === "vpython"){ _vpStarted = true; runVPython(code, done); }
  else if (CFG.lang === "pyodide") runPyodide(code, done);
  else runPython(code, done);
}

/* =====================================================================
   AJUSTEMENT DE LA FENÊTRE AU CONTENU VPython
   Le player redimensionne sa propre <iframe> via window.frameElement pour
   englober TOUT le conteneur GlowScript (scène + boutons + sliders + graphes +
   sortie print), et non la seule scène. Le canvas est dimensionné NATIVEMENT
   (largeur du conteneur ; GlowScript suit via l'événement resize), jamais par
   transform CSS — un scale fausserait le calcul de la position de la souris.
   - sans width : la fenêtre épouse le contenu, plafonné à vpDefaultWidth et à la
     place disponible ;
   - avec width : le canvas est rendu à cette largeur (réduit à la place dispo).
   La hauteur suit toujours pour que rien ne soit coupé.
===================================================================== */
var _sceneRO = null, _sceneMO = null, _fitPending = false;

function glowEls(){
  if (!els || !els.canvas) return null;
  var wrap = els.canvas.querySelector(".gs-fit");
  var gs = wrap && wrap.firstElementChild;   // le div #glowscript
  return (wrap && gs) ? { wrap: wrap, gs: gs } : null;
}
var _lastOutW = -1, _lastOutH = -1;
// Largeur réelle du contenu = bord droit le plus à droite (canvas + éléments
// dimensionnés), en ignorant les blocs étirés sur toute la largeur du conteneur
// (titre/légende) → la fenêtre épouse la scène, centrée, sans marge asymétrique.
function contentRight(gs, wrapW){
  var r0 = gs.getBoundingClientRect();
  var best = 0, i, r;
  var canv = gs.querySelectorAll("canvas");
  for (i = 0; i < canv.length; i++){
    r = canv[i].getBoundingClientRect();
    if (r.width || r.height){ var cr = r.right - r0.left; if (cr > best) best = cr; }
  }
  var all = gs.querySelectorAll("*");
  for (i = 0; i < all.length; i++){
    r = all[i].getBoundingClientRect();
    if ((r.width === 0 && r.height === 0) || r.width >= wrapW - 2) continue;
    var er = r.right - r0.left; if (er > best) best = er;
  }
  return Math.ceil(best);
}
// Bas réel du contenu (au plus juste : plus bas des canvas et enfants directs).
function contentBottom(gs){
  var r0 = gs.getBoundingClientRect();
  var h = 0, i, b;
  var canv = gs.querySelectorAll("canvas");
  for (i = 0; i < canv.length; i++){ b = canv[i].getBoundingClientRect().bottom - r0.top; if (b > h) h = b; }
  var kids = gs.children;
  for (i = 0; i < kids.length; i++){ b = kids[i].getBoundingClientRect().bottom - r0.top; if (b > h) h = b; }
  return Math.ceil(h);
}
function fitGlowscript(){
  if (CFG.autoheight && els.outPane.hidden) return;
  var fe;
  try { fe = window.frameElement; } catch(e){ fe = null; }
  if (!fe) return;
  var g = glowEls();
  if (!g) return;
  var canvas = g.gs.querySelector("canvas");
  if (!canvas) return;
  var clip = els.canvas;
  var avail = (fe.parentElement ? fe.parentElement.clientWidth : 0) || 800;
  var cap = LIBS.vpDefaultWidth;
  var layoutW = (CFG.width && CFG.width > 0)
    ? CFG.width
    : (cap && cap > 0 ? Math.min(avail, cap) : avail);

  g.gs.style.transform = "none";
  g.gs.style.display = "flow-root";
  g.wrap.style.transform = "none";
  clip.style.transform = "none";
  clip.style.overflow = "visible";
  clip.style.width = ""; clip.style.height = "";

  var bar = document.getElementById("tk-bar");
  var barH = bar ? bar.offsetHeight : 40;

  if (CFG.fit === "native"){
    // --- NATIF : aucun transform → la souris reste juste même fenêtre réduite.
    //     On dimensionne le canvas via la largeur du conteneur (GlowScript suit
    //     via l'événement resize). Ajustement potentiellement moins parfait. ---
    var targetW = Math.min(layoutW, avail);
    if (Math.abs(g.wrap.offsetWidth - targetW) > 1){
      g.wrap.style.width = targetW + "px";
      try { window.dispatchEvent(new Event("resize")); } catch(e){}
    }
    var nW = contentRight(g.gs, g.wrap.offsetWidth) || canvas.offsetWidth || targetW;
    var nH = contentBottom(g.gs);
    if (!nW || !nH) return;
    if (nW === _lastOutW && nH === _lastOutH) return;
    _lastOutW = nW; _lastOutH = nH;
    fe.style.width = nW + "px";
    fe.style.height = (barH + nH) + "px";
    fe.style.maxWidth = "100%";
    return;
  }

  // --- SCALE (défaut) : ajustement PARFAIT par transform. La fenêtre épouse
  //     exactement le contenu mis à l'échelle ; la souris peut être décalée
  //     quand l'échelle < 1 (fenêtre réduite). La largeur du conteneur reste
  //     celle posée par runVPython ; seul le scale s'adapte à la place dispo. ---
  var wrapW = g.wrap.offsetWidth;
  var natW = contentRight(g.gs, wrapW) || canvas.offsetWidth || wrapW;
  var natH = contentBottom(g.gs);
  if (!natW || !natH) return;
  var scale = natW > avail ? avail / natW : 1;
  var outW = Math.round(natW * scale);
  var outH = Math.ceil(natH * scale);
  g.wrap.style.transformOrigin = "top left";
  g.wrap.style.transform = (scale === 1) ? "none" : "scale(" + scale + ")";
  clip.style.overflow = "hidden";
  clip.style.width = outW + "px";
  clip.style.height = outH + "px";
  if (outW === _lastOutW && outH === _lastOutH) return;   // anti-scintillement
  _lastOutW = outW; _lastOutH = outH;
  fe.style.width = outW + "px";
  fe.style.height = (barH + outH) + "px";
  fe.style.maxWidth = "100%";
}
/* =====================================================================
   HAUTEUR AUTOMATIQUE (height="auto") — la fenêtre épouse le code
   Mesure la hauteur réelle de l'éditeur (CodeMirror en hauteur "auto") et
   règle celle de l'<iframe> : barre d'outils + code + bordures. Réajusté à
   chaque modification du code, au redimensionnement, au retour sur l'onglet
   Code. Sur l'onglet Résultat, la hauteur est conservée (la console défile ;
   une scène VPython, elle, ajuste la fenêtre comme d'habitude).
===================================================================== */
var AUTOH_MIN = 100;                     // hauteur minimale (px) : 2-3 lignes
var _codeFitPending = false, _lastCodeH = -1, _cmFailed = false;
function scheduleCodeFit(){
  if (!CFG || !CFG.autoheight || _codeFitPending) return;
  _codeFitPending = true;
  requestAnimationFrame(function(){ _codeFitPending = false; fitCodeHeight(); });
}
function fitCodeHeight(){
  if (!CFG || !CFG.autoheight || !els || els.editorPane.hidden) return;
  var fe;
  try { fe = window.frameElement; } catch(e){ fe = null; }
  if (!fe) return;                       // iframe d'un autre domaine : l'estimation Hugo reste
  var codeH;
  if (editor){
    codeH = editor.getWrapperElement().offsetHeight;
  } else if (!_cmFailed){
    return;                              // CodeMirror en chargement : l'estimation Hugo tient d'ici là
  } else {                               // secours sans CodeMirror : textarea brut
    els.ta.style.height = "0px";
    codeH = els.ta.scrollHeight;
    els.ta.style.height = "";
  }
  if (!codeH) return;                    // pas encore affiché (diapo cachée…)
  var h = Math.max(AUTOH_MIN, Math.ceil(chromeHeight() + codeH + 2));  // +2 : bordures
  if (h === _lastCodeH) return;
  _lastCodeH = h;
  fe.style.height = h + "px";
}

/* =====================================================================
   HAUTEUR ADAPTÉE À LA SORTIE (python / pyodide)
   Onglet Résultat : la fenêtre épouse la sortie (graphes, texte, erreurs,
   fichiers) : elle s'agrandit OU rétrécit, au plus ~90 % de la hauteur de
   l'écran (au-delà : la console défile), au moins AUTOH_MIN.
   Pendant l'exécution, elle ne fait que grandir (évite l'effet « écrasée puis
   ré-agrandie » tant que la sortie arrive) ; l'ajustement exact se fait à la fin.
   Retour sur Code : hauteur d'origine (ou celle du code en "auto").
   VPython garde son propre ajustement à la scène. Désactivé en présentation
   reveal.js (une diapositive a une taille fixe).
===================================================================== */
var OUT_MAX_FRACTION = 0.9;              // part max. de la hauteur d'écran
var _outFitPending = false, _lastOutFitH = -1;
function hostFrame(){
  var fe;
  try { fe = window.frameElement; } catch(e){ fe = null; }
  return fe;
}
// Hauteur d'origine : mémorisée SUR l'iframe (dans la page parente) pour
// survivre aux rechargements du player (bouton ■, relance).
function baseHeight(fe){
  if (CFG.autoheight && _lastCodeH > 0) return _lastCodeH;
  if (!fe.dataset.tkBaseH){
    var h0 = parseInt(fe.style.height, 10) || fe.offsetHeight;   // hauteur posée par le shortcode
    if (h0 > 0) fe.dataset.tkBaseH = String(h0);
  }
  return parseInt(fe.dataset.tkBaseH, 10) || fe.offsetHeight;
}
function outFitEnabled(fe){
  if (!CFG || CFG.lang === "vpython" || !els) return false;
  try { if (fe.closest && fe.closest(".reveal")) return false; } catch(e){}
  return true;
}
function setFrameHeight(fe, h){
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  fe.style.transition = still ? "" : "height .18s ease";
  fe.style.height = h + "px";
}
// Hauteur du contenu réel de l'onglet Résultat (indépendante de la taille
// actuelle de la fenêtre, pour pouvoir aussi redescendre).
function outContentHeight(){
  var pane = els.outPane, r0 = pane.getBoundingClientRect(), bottom = 0;
  for (var i = 0; i < pane.children.length; i++){
    var c = pane.children[i];
    if (c.hidden || !c.offsetParent) continue;           // éléments masqués
    var b = c.getBoundingClientRect().bottom - r0.top + pane.scrollTop;
    if (b > bottom) bottom = b;
  }
  var cs = window.getComputedStyle(pane);
  return Math.ceil(bottom + (parseFloat(cs.paddingBottom) || 0));
}
function scheduleOutFit(){
  if (_outFitPending) return;
  _outFitPending = true;
  requestAnimationFrame(function(){ _outFitPending = false; fitOutHeight(); });
}
function fitOutHeight(){
  var fe = hostFrame();
  if (!fe || !outFitEnabled(fe) || els.outPane.hidden) return;
  baseHeight(fe);                        // (mémorise l'origine si ce n'est déjà fait)
  var want = Math.ceil(chromeHeight() + outContentHeight() + 2);   // +2 : bordures
  var screenH = 0;
  try { screenH = fe.ownerDocument.defaultView.innerHeight; } catch(e){}
  if (screenH) want = Math.min(want, Math.round(screenH * OUT_MAX_FRACTION));
  var h = Math.max(AUTOH_MIN, want);
  if (_running) h = Math.max(h, parseInt(fe.style.height, 10) || 0);   // en cours : grandir seulement
  if (h === _lastOutFitH) return;
  _lastOutFitH = h;
  setFrameHeight(fe, h);
}
// Retour sur l'onglet Code : hauteur d'origine.
function restoreCodeHeight(){
  _lastOutFitH = -1;
  if (CFG.autoheight){ _lastCodeH = -1; scheduleCodeFit(); return; }   // "auto" : ré-épouser le code
  var fe = hostFrame();
  if (fe && outFitEnabled(fe)) setFrameHeight(fe, baseHeight(fe));
}
function watchOutput(){
  var fe = hostFrame();
  if (fe) baseHeight(fe);                // mémorise la hauteur d'origine AVANT tout changement
  if (!window.ResizeObserver) return;
  var ro = new ResizeObserver(scheduleOutFit);   // print, image chargée, erreur, fichiers…
  [els.stdout, els.canvas, els.errBox, els.files].forEach(function(x){ if (x) ro.observe(x); });
  if (window.MutationObserver) new MutationObserver(scheduleOutFit).observe(els.outPane, { childList: true });
}

function scheduleFit(){
  if (_fitPending) return;
  _fitPending = true;
  requestAnimationFrame(function(){ _fitPending = false; fitGlowscript(); });
}
function observeScene(){
  if (CFG.lang !== "vpython") return;
  if (_sceneRO) { _sceneRO.disconnect(); _sceneRO = null; }
  if (_sceneMO) { _sceneMO.disconnect(); _sceneMO = null; }
  var tries = 0;
  (function attach(){
    var g = glowEls();
    var canvas = g && g.gs.querySelector("canvas");
    if (g && canvas){
      scheduleFit();
      // ré-ajuster quand la scène change de taille…
      if (typeof ResizeObserver !== "undefined"){
        _sceneRO = new ResizeObserver(scheduleFit);
        _sceneRO.observe(canvas);
      }
      // …et quand GlowScript ajoute des éléments (graphes, sortie print, boutons)
      if (typeof MutationObserver !== "undefined"){
        _sceneMO = new MutationObserver(scheduleFit);
        _sceneMO.observe(g.gs, { childList: true, subtree: true, characterData: true });
      }
    } else if (tries++ < 60){
      setTimeout(attach, 100);
    }
  })();
}
window.addEventListener("resize", function(){
  if (CFG && CFG.lang === "vpython") scheduleFit();
  scheduleCodeFit();                     // largeur changée → barre de défilement horizontale ?
  scheduleOutFit();                      // largeur changée → le texte se ré-enroule
});

function utf8ToB64url(s){
  var b64 = window.btoa(unescape(encodeURIComponent(s)));
  return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function stopRun(){
  if (!CFG) return;
  reloadWith({ autorun: false, idle: true });   // idle : pas de relance automatique
}

// Appelé quand la slide reveal.js contenant l'iframe devient visible :
// on rafraîchit l'éditeur et on réajuste la scène (un canvas créé masqué a une
// taille nulle). On ne relance le programme que si autorun est demandé.
function onSlideVisible(){
  if (!CFG) return;
  if (editor) setTimeout(function(){ editor.refresh(); scheduleCodeFit(); }, 0);
  if (CFG.lang === "vpython") setTimeout(scheduleFit, 60);
  if (CFG.autorun && !CFG.idle && !_running && !(CFG.lang === "vpython" && _vpStarted)) run();
}

function builtinRead(x){
  if (window.Sk.builtinFiles === undefined || window.Sk.builtinFiles["files"][x] === undefined)
    throw "Module introuvable : '" + x + "'";
  return window.Sk.builtinFiles["files"][x];
}
function makeInputFun(){
  return function(promptStr){
    return new Promise(function(resolve){
      if (promptStr) els.stdout.appendChild(document.createTextNode(promptStr));
      var wrap   = el("span", {class:"tk-inwrap"});
      var mirror = el("span", {class:"tk-instyle"});      // texte affiché (bleu)
      var caret  = el("span", {class:"tk-caret"});
      var inp    = el("input", {class:"tk-stdin", type:"text",
                                autocomplete:"off", autocorrect:"off",
                                autocapitalize:"off", spellcheck:"false"});
      // l'input (invisible) capte la frappe ; mirror affiche ; caret = curseur bloc
      wrap.appendChild(mirror); wrap.appendChild(caret); wrap.appendChild(inp);
      els.stdout.appendChild(wrap);

      function sync(){ mirror.textContent = inp.value; }   // recopie la saisie
      sync();
      inp.focus();

      // un clic dans la console redonne le focus à la saisie en cours
      function refocus(){ if (document.body.contains(inp)) inp.focus(); }
      els.stdout.addEventListener("click", refocus);

      inp.addEventListener("input", sync);
      inp.addEventListener("keydown", function(ev){
        if (ev.key === "Enter"){
          ev.preventDefault();
          els.stdout.removeEventListener("click", refocus);
          var v = inp.value;
          var done = el("span", {class:"tk-instyle"});
          done.textContent = v + "\n";          // valeur conservée en bleu, dans le flux
          wrap.replaceWith(done);
          resolve(v);
        }
      });
    });
  };
}
/* Préambule : redéfinit open() pour CAPTURER les écritures de fichiers en
   mémoire (comme l'onglet "fichier" de Trinket). Les print() ne sont pas
   touchés. Après l'exécution, le contenu est lu puis affiché avec un bouton
   Copier (prêt à coller dans un tableur / grapheur). */
/* =====================================================================
   THÈME CLAIR / SOMBRE (theme="light" | "dark" | "auto")
===================================================================== */
function isDark(){ return document.documentElement.classList.contains("tk-dark"); }
function applyDark(on){
  document.documentElement.classList.toggle("tk-dark", !!on);
  if (editor){ editor.setOption("theme", on ? "tkdark" : "default"); editor.refresh(); }
}
function setupTheme(){

/* =====================================================================
   IMPORT DE FICHIERS PAR L'ÉLÈVE (upload="true") — python / pyodide
   Bouton ⇪ dans la barre ou glisser-déposer sur la fenêtre. Le programme lit
   le fichier par son nom : open("mesures.csv"), pandas.read_csv("mesures.csv").
   • Texte converti en UTF-8 (un CSV d'Excel est souvent en Windows-1252 : sans
     conversion, les accents feraient planter la lecture) ; fins de ligne
     Windows normalisées ; BOM retiré.
   • Fichier binaire (image, xlsx…) : Pyodide seulement, tel quel.
   • Conservés le temps de la session de l'onglet (survivent au bouton ■ et au
     rechargement de la page) ; un fichier importé remplace un fichier data=
     de même nom.
===================================================================== */
var UPLOAD_MAX = 5 * 1024 * 1024;        // 5 Mo par fichier
var _uploads = {};                       // nom → { text } ou { bin: Uint8Array }, + size, enc

function uploadStoreKey(){
  var fe = hostFrame();
  if (!fe || !fe.id) return null;
  try { return "tk-uploads:" + fe.ownerDocument.location.pathname + "#" + fe.id; } catch(e){ return null; }
}
function saveUploads(){
  var k = uploadStoreKey(); if (!k) return;
  var keep = {};
  for (var n in _uploads) if (_uploads[n].text != null) keep[n] = { text: _uploads[n].text, size: _uploads[n].size, enc: _uploads[n].enc };
  try { sessionStorage.setItem(k, JSON.stringify(keep)); } catch(e){}   // quota dépassé : tant pis
}
function loadUploads(){
  var k = uploadStoreKey(); if (!k) return;
  try { var o = JSON.parse(sessionStorage.getItem(k) || "{}"); for (var n in o) _uploads[n] = o[n]; } catch(e){}
}
function safeFileName(n){
  n = String(n || "fichier").split(/[\\/]/).pop().replace(/[:*?"<>|]/g, "_").trim();
  return (n && n !== "." && n !== "..") ? n : "fichier";
}
function decodeUpload(buf){
  var u8 = new Uint8Array(buf), txt, enc;
  if (u8[0] === 0xFF && u8[1] === 0xFE){ txt = new TextDecoder("utf-16le").decode(u8); enc = "UTF-16"; }
  else if (u8[0] === 0xFE && u8[1] === 0xFF){ txt = new TextDecoder("utf-16be").decode(u8); enc = "UTF-16"; }
  else {
    for (var i = 0, n = Math.min(u8.length, 8000); i < n; i++) if (u8[i] === 0) return { bin: u8 };   // binaire
    try { txt = new TextDecoder("utf-8", { fatal: true }).decode(u8); enc = "UTF-8"; }
    catch(e){ txt = new TextDecoder("windows-1252").decode(u8); enc = "Windows-1252"; }
  }
  if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1);              // BOM
  return { text: txt.replace(/\r\n?/g, "\n"), enc: enc };
}
function uploadMessage(msg){
  var s = els.uploads; if (!s) return;
  var m = s.querySelector(".tk-upmsg");
  if (!m){ m = el("span", {class:"tk-upmsg", role:"status"}); s.appendChild(m); }
  m.textContent = msg; s.hidden = false; refitChrome();
  clearTimeout(uploadMessage._t);
  uploadMessage._t = setTimeout(function(){ if (m.parentNode) m.remove(); renderUploads(); }, 5000);
}
// Contenu d'un fichier en octets (FileReader en secours : anciens Safari < 14).
function readBytes(f){
  if (f.arrayBuffer) return f.arrayBuffer();
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
    r.readAsArrayBuffer(f);
  });
}
function addUploads(list){
  var jobs = [].slice.call(list || []).map(function(f){
    var name = safeFileName(f.name);
    if (f.size > UPLOAD_MAX){ uploadMessage("« " + name + " » dépasse 5 Mo : non importé."); return null; }
    return readBytes(f).then(function(buf){
      var d = decodeUpload(buf);
      if (d.bin && CFG.lang !== "pyodide"){
        uploadMessage("« " + name + " » n'est pas un fichier texte : non lisible ici."); return;
      }
      d.size = f.size; _uploads[name] = d;
    });
  });
  return Promise.all(jobs).then(function(){ saveUploads(); renderUploads(); });
}
function formatSize(n){ return n < 1024 ? n + " o" : n < 1048576 ? Math.round(n / 1024) + " ko" : (n / 1048576).toFixed(1) + " Mo"; }
function renderUploads(){
  var s = els.uploads; if (!s) return;
  var msg = s.querySelector(".tk-upmsg");
  s.innerHTML = "";
  var names = Object.keys(_uploads).sort();
  names.forEach(function(n){
    var u = _uploads[n];
    var chip = el("span", {class:"tk-chip", title:'Lire avec open("' + n + '")' + (u.enc && u.enc !== "UTF-8" ? " — converti de " + u.enc + " en UTF-8" : "")});
    chip.innerHTML = ICONS.file;
    chip.appendChild(el("span", {class:"tk-chip-name"}, [n]));
    chip.appendChild(el("small", {}, [formatSize(u.size || 0)]));
    var x = el("button", {type:"button", "aria-label":"Retirer " + n, title:"Retirer"}, ["×"]);
    x.onclick = function(){ delete _uploads[n]; saveUploads(); renderUploads(); };
    chip.appendChild(x);
    s.appendChild(chip);
  });
  if (msg) s.appendChild(msg);
  s.hidden = !names.length && !msg;
  refitChrome();
}
// La bande des fichiers change la hauteur « hors code » : on réajuste la fenêtre.
function refitChrome(){ _lastCodeH = -1; _lastOutFitH = -1; scheduleCodeFit(); scheduleOutFit(); }
// Hauteur de tout ce qui n'est pas le code / la sortie : barre + bande des fichiers.
function chromeHeight(){
  var bar = document.getElementById("tk-bar"), h = bar ? bar.offsetHeight : 40;
  if (els && els.uploads && !els.uploads.hidden) h += els.uploads.offsetHeight;
  return h;
}
function setupUpload(bar){
  if (!CFG.upload) return;
  var accept = CFG.upload === "auto"
    ? (CFG.lang === "pyodide" ? "" : ".csv,.tsv,.txt,.dat,.json")
    : CFG.upload;
  var input = el("input", {type:"file", multiple:"multiple", "aria-hidden":"true", tabindex:"-1"});
  if (accept) input.setAttribute("accept", accept);
  input.style.display = "none";
  input.onchange = function(){ addUploads(input.files).then(function(){ input.value = ""; }); };
  document.body.appendChild(input);
  var btn = el("button", {class:"tk-ghostbtn tk-upload", type:"button", title:"Importer un fichier (ou le glisser sur la fenêtre)", "aria-label":"Importer un fichier"});
  btn.innerHTML = ICONS.upload;
  btn.onclick = function(){ input.click(); };
  bar.appendChild(btn);
  // glisser-déposer sur toute la fenêtre
  var root = document.getElementById("tk-root"), depth = 0;
  root.addEventListener("dragenter", function(e){ if (e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], "Files") >= 0){ depth++; root.classList.add("is-drop"); } });
  root.addEventListener("dragleave", function(){ if (--depth <= 0){ depth = 0; root.classList.remove("is-drop"); } });
  root.addEventListener("dragover", function(e){ e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; });
  root.addEventListener("drop", function(e){
    e.preventDefault(); depth = 0; root.classList.remove("is-drop");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addUploads(e.dataTransfer.files);
  });
  loadUploads(); renderUploads();
}
// Toutes les données visibles du programme : data= du shortcode + fichiers importés.
function allData(withBinary){
  var out = {}, d = (CFG && CFG.data) || {}, k;
  for (k in d) out[k] = d[k];
  for (k in _uploads){
    if (_uploads[k].text != null) out[k] = _uploads[k].text;
    else if (withBinary) out[k] = _uploads[k].bin;
  }
  return out;
}

var PYFILE_SHIM =
  "__tkfiles__ = {}\n" +
  // Skulpt ne connaît qu'IOError : on crée OSError et FileNotFoundError comme en
  // Python 3 (un élève peut alors écrire « except FileNotFoundError: »).
  "try:\n" +
  "    OSError\n" +
  "except NameError:\n" +
  "    OSError = IOError\n" +
  "try:\n" +
  "    FileNotFoundError\n" +
  "except NameError:\n" +
  "    class FileNotFoundError(OSError): pass\n" +
  "class __TkFile__:\n" +
  "    def __init__(s, n, m='r'):\n" +
  "        s.n = n; s.m = m; s.p = 0\n" +
  "        if 'w' in m or 'x' in m:\n" +             // écriture : fichier remis à zéro
  "            __tkfiles__[n] = ''\n" +
  "        elif 'a' in m:\n" +                        // ajout : on garde le contenu
  "            if n not in __tkfiles__: __tkfiles__[n] = ''\n" +
  "        elif n not in __tkfiles__:\n" +            // lecture d'un fichier absent
  "            raise FileNotFoundError(\"[Errno 2] No such file or directory: '\" + n + \"'\")\n" +
  "    def write(s, x):\n" +
  "        __tkfiles__[s.n] = __tkfiles__.get(s.n, '') + x\n" +
  "        return len(x)\n" +
  "    def writelines(s, xs):\n" +
  "        for x in xs: s.write(x)\n" +
  "    def read(s, k=-1):\n" +
  "        t = __tkfiles__.get(s.n, '')\n" +
  "        if k is None or k < 0: r = t[s.p:]\n" +
  "        else: r = t[s.p:s.p + k]\n" +
  "        s.p = s.p + len(r)\n" +
  "        return r\n" +
  "    def readline(s, *a):\n" +
  "        t = __tkfiles__.get(s.n, '')\n" +
  "        i = t.find('\\n', s.p)\n" +
  "        e = len(t) if i < 0 else i + 1\n" +
  "        r = t[s.p:e]\n" +
  "        s.p = e\n" +
  "        return r\n" +
  "    def readlines(s, *a):\n" +
  "        out = []\n" +
  "        while True:\n" +
  "            l = s.readline()\n" +
  "            if l == '': break\n" +
  "            out.append(l)\n" +
  "        return out\n" +
  "    def __iter__(s): return iter(s.readlines())\n" +
  "    def seek(s, p, *a):\n" +
  "        s.p = p\n" +
  "        return p\n" +
  "    def tell(s): return s.p\n" +
  "    def flush(s): pass\n" +
  "    def close(s): pass\n" +
  "    def __enter__(s): return s\n" +
  "    def __exit__(s, *a): return False\n" +
  "def open(n, m='r', *a, **k): return __TkFile__(n, m)\n";
var PYFILE_OFFSET = (PYFILE_SHIM.match(/\n/g) || []).length;  // lignes ajoutées

var _pyPrefixLines = PYFILE_OFFSET;       // préambule réel (shim + données) de l'exécution en cours
// Le préambule décale les numéros de ligne → on les corrige dans les erreurs.
// Si l'erreur est levée DANS le préambule (ex. open() d'un fichier absent), on
// remonte la pile d'appels jusqu'à la ligne la plus interne du programme de l'élève.
function formatPyError(err){
  var s = String(err), off = _pyPrefixLines, userLine = null;
  var tb = err && err.traceback;
  if (tb && tb.length){
    for (var i = 0; i < tb.length; i++){
      if (tb[i] && tb[i].lineno > off){ userLine = tb[i].lineno - off; break; }
    }
  }
  if (userLine) return /line \d+/.test(s) ? s.replace(/line \d+/, "line " + userLine) : s + " on line " + userLine;
  return s.replace(/line (\d+)/g, function(whole, n){
    var v = parseInt(n, 10) - off;
    return v >= 1 ? ("line " + v) : whole;
  });
}
// Ligne Python qui pré-remplit le système de fichiers avec les données du shortcode
// (paramètre data=) : un dict JSON, qui est aussi un littéral Python valide.
function pyDataLine(){
  var d = allData(false);                // data= du shortcode + fichiers importés (texte)
  return Object.keys(d).length ? "__tkfiles__.update(" + JSON.stringify(d) + ")\n" : "";
}
// Fichiers à montrer dans « Fichiers générés » : les données fournies non modifiées sont exclues.
function onlyGenerated(files){
  var out = {}, d = allData(false);
  for (var k in files) if (!(k in d && d[k] === files[k])) out[k] = files[k];
  return out;
}
function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText){
    try { return navigator.clipboard.writeText(t); } catch(e){}
  }
  return new Promise(function(res){
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta); res();
  });
}
function renderFiles(files){
  if (!els.files) return;
  els.files.innerHTML = "";
  var any = false, names = files ? Object.keys(files) : [];
  for (var i = 0; i < names.length; i++){
    var name = names[i];
    var content = files[name];
    if (content == null) continue;
    content = String(content);
    any = true;
    var box  = el("div", {class:"tk-file"});
    var head = el("div", {class:"tk-file-head"});
    var nm   = el("span", {class:"tk-file-name"}); nm.textContent = name;
    var btn  = el("button", {class:"tk-file-copy", type:"button"}); btn.textContent = "Copier";
    var dl   = el("button", {class:"tk-file-copy", type:"button"}); dl.textContent = "Télécharger";
    var grp  = el("div", {class:"tk-file-btns"});
    var area = el("textarea", {class:"tk-file-content", readonly:"readonly", spellcheck:"false"});
    area.value = content;
    (function(c, b, a, d, fname){
      b.addEventListener("click", function(){
        a.focus(); a.select();
        copyText(c).then(function(){
          var old = b.textContent; b.textContent = "Copié \u2713";
          setTimeout(function(){ b.textContent = old; }, 1500);
        });
      });
      d.addEventListener("click", function(){
        try {
          var blob = new Blob([c], {type:"text/plain;charset=utf-8"});
          var url = URL.createObjectURL(blob);
          var lnk = document.createElement("a");
          lnk.href = url; lnk.download = fname || "fichier.txt";
          document.body.appendChild(lnk); lnk.click(); document.body.removeChild(lnk);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
        } catch(e){}
      });
    })(content, btn, area, dl, name);
    grp.appendChild(btn); grp.appendChild(dl);
    head.appendChild(nm); head.appendChild(grp);
    box.appendChild(head); box.appendChild(area);
    els.files.appendChild(box);
  }
  els.files.hidden = !any;
}
function capturePyFiles(mod){
  try {
    var Sk = window.Sk;
    var d = mod && mod.$d;
    if (!d || !d.__tkfiles__) return;
    renderFiles(onlyGenerated(Sk.ffi.remapToJs(d.__tkfiles__)));
  } catch(e){ /* pas de fichier généré : on ignore */ }
}
function runPython(code, done){
  loadFirst(LIBS.skulpt).then(function(){ return loadFirst(LIBS.skulptStdlib); }).then(function(){
    var Sk = window.Sk;
    Sk.configure({
      output: function(t){ els.stdout.appendChild(document.createTextNode(t)); },
      read: builtinRead,
      inputfun: makeInputFun(),
      inputfunTakesPrompt: true,
      __future__: Sk.python3
    });
    (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = "tk-canvas";
    Sk.misceval.asyncToPromise(function(){
      var prefix = PYFILE_SHIM + pyDataLine();
      _pyPrefixLines = (prefix.match(/\n/g) || []).length;
      return Sk.importMainWithBody("<stdin>", false, prefix + code, true);
    }).then(function(mod){ capturePyFiles(mod); done(); },
            function(err){ showPyError(err); done(); });
  }).catch(function(){
    showError("Impossible de charger le moteur Python (Skulpt).\n"
      + "Vérifie ta connexion, ou héberge Skulpt en local (voir le README, "
      + "dossier static/trinket/skulpt_libraries/).");
    done();
  });
}

/* =====================================================================
   MOTEUR PYODIDE — lang="pyodide"
   Vrai CPython compilé en WebAssembly : numpy, matplotlib, scipy, sympy…
   • Chargé une seule fois (le runtime reste en mémoire ; relancer est rapide).
   • Les paquets sont détectés automatiquement d'après les `import` du code.
   • Chaque exécution repart avec des variables vierges.
   • matplotlib : backend standard "Agg" ; plt.show() insère l'image PNG dans
     la console, à sa place parmi les print(). Les figures non montrées sont
     affichées à la fin (comme dans un notebook).
   • input() : boîte de dialogue du navigateur (Pyodide tourne de façon
     synchrone, la saisie inline de Skulpt n'est pas possible ici).
   • Les fichiers écrits (open(..., "w")) apparaissent dans « Fichiers générés ».
===================================================================== */
var _pyo = null;                 // promesse de l'instance Pyodide
var _pyoLastLine = "";           // dernière ligne affichée (sert d'invite à input())
var _pyoMpl = false;             // matplotlib déjà configuré ?

// Python d'amorçage : dossier de travail propre + utilitaires fichiers.
var PYO_BOOT =
  "import os, sys\n" +
  "os.makedirs('/tmp/tk-run', exist_ok=True)\n" +
  "os.chdir('/tmp/tk-run')\n" +
  "def _tk_clean():\n" +
  "    os.chdir('/tmp/tk-run')\n" +
  "    for n in os.listdir('.'):\n" +
  "        if os.path.isfile(n): os.remove(n)\n" +
  "def _tk_files():\n" +
  "    r = {}\n" +
  "    for n in sorted(os.listdir('/tmp/tk-run')):\n" +
  "        p = os.path.join('/tmp/tk-run', n)\n" +
  "        if os.path.isfile(p) and os.path.getsize(p) <= 300000:\n" +
  "            try:\n" +
  "                with open(p, encoding='utf-8') as f: r[n] = f.read()\n" +
  "            except Exception: pass\n" +   // fichier binaire (image…) : ignoré
  "    return r\n" +
  "def _tk_flush():\n" +
  "    sys.stdout.flush(); sys.stderr.flush()\n" +
  // modules importés par le code mais introuvables (noms de premier niveau)
  "def _tk_missing(src):\n" +
  "    import importlib.util\n" +
  "    from pyodide.code import find_imports\n" +
  "    try: mods = find_imports(src)\n" +
  "    except Exception: return []\n" +      // erreur de syntaxe : signalée à l'exécution
  "    out = []\n" +
  "    for m in mods:\n" +
  "        m = m.split('.')[0]\n" +
  "        if m in out: continue\n" +
  "        try: found = importlib.util.find_spec(m) is not None\n" +
  "        except Exception: found = False\n" +
  "        if not found: out.append(m)\n" +
  "    return out\n";

// Python de configuration de matplotlib (exécuté une fois, après son chargement).
var PYO_MPL =
  "import io, base64, warnings\n" +
  "import matplotlib\n" +
  "matplotlib.use('Agg')\n" +
  // Avertissements internes à matplotlib 3.10 sous WebAssembly : ses fonctions C++
  // de texte/rendu (FreeType, Agg) reçoivent des décimaux au lieu d'entiers pour
  // x, y, x0, y0, x1, y1, width, height. Sans effet sur le rendu, jamais causés par
  // le code de l'élève (API interne) → on masque CETTE famille de messages seulement,
  // les autres avertissements de matplotlib restent visibles.
  "warnings.filterwarnings('ignore', message=r'The \\w+ parameter as float was deprecated',\n" +
  "                        category=matplotlib.MatplotlibDeprecationWarning)\n" +
  "import matplotlib.pyplot as _tk_plt\n" +
  "import tkbridge\n" +
  "def _tk_show(*args, **kwargs):\n" +
  "    _tk_flush()\n" +                       // les print() précédents d'abord
  "    for _n in _tk_plt.get_fignums():\n" +
  "        _f = _tk_plt.figure(_n)\n" +
  "        _b = io.BytesIO()\n" +
  "        _f.savefig(_b, format='png', dpi=144, bbox_inches='tight')\n" +
  "        tkbridge.image(base64.b64encode(_b.getvalue()).decode('ascii'))\n" +
  "    _tk_plt.close('all')\n" +
  "_tk_plt.show = _tk_show\n";

function pyoWrite(text, isErr){
  if (!text) return;
  _pyoLastLine = (_pyoLastLine + text).split("\n").pop();
  if (isErr){
    var s = el("span", {class:"tk-stderr"}); s.textContent = text;
    els.stdout.appendChild(s);
  } else {
    els.stdout.appendChild(document.createTextNode(text));
  }
}
function pyoImage(b64){
  var img = el("img", {class:"tk-plot", alt:"Figure matplotlib"});
  // rendu à 144 dpi → affiché à taille « 100 dpi » : net sur écran haute densité
  img.onload = function(){ img.style.width = Math.round(img.naturalWidth / 1.44) + "px"; };
  img.src = "data:image/png;base64," + b64;
  els.stdout.appendChild(img);
}
// Petite ligne d'état discrète pendant les téléchargements.
function pyoStatus(msg){
  var s = els.outPane.querySelector(".tk-status");
  if (!msg){ if (s) s.remove(); return; }
  if (!s){ s = el("div", {class:"tk-status"}); els.outPane.insertBefore(s, els.outPane.firstChild); }
  s.textContent = msg;
}

function getPyodide(){
  if (_pyo) return _pyo;
  pyoStatus("Démarrage de Python… (la première fois peut prendre quelques secondes)");
  _pyo = loadFirst(LIBS.pyodide).then(function(url){
    return window.loadPyodide({ indexURL: url.replace(/[^\/]*$/, "") });
  }).then(function(py){
    var decOut = new TextDecoder(), decErr = new TextDecoder();
    py.setStdout({ write: function(b){ pyoWrite(decOut.decode(b, {stream:true}), false); return b.length; } });
    py.setStderr({ write: function(b){ pyoWrite(decErr.decode(b, {stream:true}), true);  return b.length; } });
    py.setStdin({ stdin: function(){
      var v = window.prompt(_pyoLastLine || "Entrée :", "");
      if (v === null) v = "";
      var s = el("span", {class:"tk-instyle"}); s.textContent = v + "\n";   // écho en bleu
      els.stdout.appendChild(s); _pyoLastLine = "";
      return v;
    }});
    py.registerJsModule("tkbridge", { image: pyoImage });
    return py.runPythonAsync(PYO_BOOT).then(function(){ return py; });
  });
  _pyo.catch(function(){ _pyo = null; });   // autoriser un nouvel essai
  return _pyo;
}

// Traceback Pyodide → uniquement les lignes du programme de l'élève.
function cleanPyTraceback(msg){
  var lines = String(msg).replace(/\s+$/, "").split("\n"), out = [], keep = true;
  for (var i = 0; i < lines.length; i++){
    var L = lines[i];
    if (/^\s+File "/.test(L)){ keep = /File "main\.py"/.test(L); if (keep) out.push(L); continue; }
    if (/^\S/.test(L)) keep = true;          // en-tête ou ligne finale de l'exception
    if (keep) out.push(L);
  }
  var txt = out.join("\n").replace(/^Traceback \(most recent call last\):/,
                                   "Traceback (appel le plus récent en dernier) :");
  var m, re = /File "main\.py", line (\d+)/g, line = null;
  while ((m = re.exec(txt))) line = parseInt(m[1], 10);   // ligne la plus interne
  return { text: txt, line: line };
}

function runPyodide(code, done){
  _pyoLastLine = "";
  var py, ns = null, failed = null, pipFailed = {};
  getPyodide().then(function(p){
    py = p;
    return py.loadPackagesFromImports(code, {
      messageCallback: function(msg){ if (/^Loading /.test(msg)) pyoStatus("Chargement des bibliothèques : " + msg.replace(/^Loading /, "")); },
      errorCallback:   function(){}
    });
  }).then(function(){
    // Paquets PyPI : ceux déclarés par packages="…" + ceux de la liste blanche importés par le code
    var req = (CFG.packages || []).slice();
    var miss = py.globals.get("_tk_missing")(code), names = miss.toJs(); miss.destroy();
    names.forEach(function(m){
      var pip = (LIBS.pypiAuto || {})[m];
      if (pip && req.indexOf(pip) < 0) req.push(pip);
    });
    if (!req.length) return;
    pyoStatus("Installation depuis PyPI : " + req.join(", ") + "…");
    return py.loadPackage("micropip").then(function(){
      // un paquet à la fois : l'échec de l'un n'empêche pas les autres
      return req.reduce(function(chain, pkg){
        return chain.then(function(){
          py.globals.set("_tk_req", pkg);
          return py.runPythonAsync("import micropip\nawait micropip.install(_tk_req)")
            .catch(function(e){ pipFailed[pkg.split(/[<>=!~\[ ]/)[0].toLowerCase()] = true; });
        });
      }, Promise.resolve());
    });
  }).then(function(){
    // matplotlib a pu arriver comme dépendance (seaborn…) : on le cherche côté Python
    if (!_pyoMpl && py.runPython("import importlib.util as _u; _u.find_spec('matplotlib') is not None")){
      pyoStatus("Préparation de matplotlib…");
      return py.runPythonAsync(PYO_MPL).then(function(){ _pyoMpl = true; });
    }
  }).then(function(){
    pyoStatus(null);
    py.globals.get("_tk_clean")();
    var d = allData(true);                       // data= du shortcode + fichiers importés
    for (var name in d){
      if (/^[^\/\\]+$/.test(name) && name !== "." && name !== "..")
        py.FS.writeFile("/tmp/tk-run/" + name, d[name]);   // texte (UTF-8) ou octets
    }
    if (_pyoMpl) py.runPython("_tk_plt.close('all')");
    ns = py.globals.get("dict")();              // variables vierges à chaque exécution
    ns.set("__name__", "__main__");
    return py.runPythonAsync(code, { globals: ns, filename: "main.py" })
             .catch(function(err){ failed = err; });
  }).then(function(){
    try { py.globals.get("_tk_flush")(); } catch(e){}
    if (_pyoMpl && !failed){ try { py.globals.get("_tk_show")(); } catch(e){} }   // figures restantes
    try {
      var f = py.globals.get("_tk_files")();
      var files = f.toJs({ dict_converter: Object.fromEntries }); f.destroy();
      files = onlyGenerated(files);
      if (Object.keys(files).length) renderFiles(files);
    } catch(e){}
    if (ns){ try { ns.destroy(); } catch(e){} }
    if (failed){
      if (failed.type){
        var pre = cleanPyTraceback(failed.message);
        var mm = failed.type === "ModuleNotFoundError" && /No module named '([^'.]+)/.exec(failed.message);
        if (mm){
          var mod = mm[1], pip = (LIBS.pypiAuto || {})[mod] || mod;
          pre.text += pipFailed[pip.toLowerCase()]
            ? "\n\n→ « " + pip + " » n'a pas pu être installé depuis PyPI (connexion, ou paquet "
              + "non compatible : seuls les paquets en Python pur s'installent dans le navigateur)."
            : "\n\n→ Le module « " + mod + " » n'existe pas dans Python pour navigateur (Pyodide). "
              + "Faute de frappe ? S'il s'agit d'un paquet PyPI en Python pur, il peut être "
              + "ajouté avec packages=\"" + mod + "\" dans le shortcode.";
        }
        showPyError(failed, pre);
      }
      else showError(String(failed));
    }
    done();
  }).catch(function(err){
    pyoStatus(null);
    showError(py ? String(err)
      : "Impossible de charger Python scientifique (Pyodide).\n"
        + "Vérifie ta connexion : il est téléchargé depuis cdn.jsdelivr.net.");
    done();
  });
}

/* =====================================================================
   MOTEUR VPYTHON — GlowScript
   Reproduit la séquence officielle de GlowScriptOffline/GlowScript.html :
   charger runtime + compilateur, compiler la source, puis eval + __main__().
===================================================================== */
// Version GlowScript effective : celle demandée par l'embed (version="…") si
// valide, sinon la version par défaut du player (LIBS.gsVersion).
function vpVersion(){
  return (CFG && CFG.version) ? CFG.version : LIBS.gsVersion;
}
function ensureVPythonHeader(src){
  var V = vpVersion();
  var nl = src.indexOf("\n");
  var first = nl >= 0 ? src.slice(0, nl) : src;
  var rest  = nl >= 0 ? src.slice(nl) : "";
  var header = "Web VPython " + V;
  if (/^\s*Web\s*VPython\s*[0-9]\.[0-9]\s*$/i.test(first)) return header + rest;
  if (/^\s*GlowScript\s*[0-9]\.[0-9]\s*VPython\s*$/i.test(first)) return header + rest;
  if (/^\s*from\s+vpython\s+import\s+\*\s*$/i.test(first)) return header + rest;
  return header + "\n" + src;
}
function formatGSError(err){
  err = String(err);
  // une ligne d'en-tête a été ajoutée → on décrémente le numéro de ligne annoncé
  var m = err.match(/line(\s*)([0-9]+):/);
  if (m){ var n = parseInt(m[2], 10) - 1; err = err.slice(0, m.index) + "line " + n + err.slice(m.index + m[0].length - 1); }
  return err;
}
var _vpReady = false;
function loadVPython(){
  if (_vpReady) return Promise.resolve();
  var V = vpVersion(), B = LIBS.gsBase;
  return loadCss(B + "jquery-ui.custom.css")
    .then(function(){ return loadCss(B + "ide.css"); })
    .then(function(){ return loadScriptsSequential([
      B + "jquery.min.js",
      B + "jquery-ui.custom.min.js",
      B + "RSrun." + V + ".min.js",
      B + "glow." + V + ".min.js",
      B + "Roboto_Medium_ttf_sans.js",
      B + "NimbusRomNo9L_Med_otf_serif.js",
      B + "RScompiler." + V + ".min.js"
    ]); })
    .then(function(){ _vpReady = true; });
}
async function _runCompiled(prog, done){
  try {
    eval(prog);            // définit __main__ (fonction asynchrone)
    await __main__();      // exécute le programme GlowScript
    done();
  } catch(err){ showError(String(err)); done(); }
}
function availWidth(){
  var fe;
  try { fe = window.frameElement; } catch(e){ fe = null; }
  if (fe && fe.parentElement && fe.parentElement.clientWidth) return fe.parentElement.clientWidth;
  return window.innerWidth || 800;
}
function runVPython(code, done){
  loadVPython().then(function(){
    var src = ensureVPythonHeader(code);
    var program;
    try {
      program = window.glowscript_compile(src, { lang:"vpython", version:vpVersion() });
    } catch(err){ showError(formatGSError(err)); done(); return; }

    // Largeur du conteneur FIXÉE avant l'exécution : un canvas GlowScript se cale
    // sur la largeur de son conteneur à sa création. width= si fourni, sinon la
    // place disponible, éventuellement plafonnée par LIBS.vpDefaultWidth.
    var cap = LIBS.vpDefaultWidth;
    var layoutW = (CFG.width && CFG.width > 0)
      ? CFG.width
      : (cap && cap > 0 ? Math.min(availWidth(), cap) : availWidth());
    els.canvas.innerHTML = '<div class="gs-fit" style="width:' + layoutW + 'px"><div id="glowscript" class="glowscript"></div></div>';
    window.__context = { glowscript_container: window.$("#glowscript") };
    _runCompiled(program, done);
    observeScene();   // ajuste/centre la fenêtre une fois la scène rendue
  }).catch(function(err){
    showError("VPython indisponible : " + err.message +
      "\nAs-tu bien placé glowscript_libraries/ dans static/trinket/ ? (voir README)");
    done();
  });
}

/* Démarrage : en DERNIER, une fois tout le script évalué. */
boot();
